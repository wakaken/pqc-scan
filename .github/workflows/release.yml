name: Local distribution preparation

# Manual preparation only. No tags, release upload, publication or signing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify declared native target
        run: test "$(uname -m)" = arm64
      - name: Test packaging safety
        run: python3 -m unittest discover -s tests/distribution -v
      - name: Build and prepare static snapshot
        run: |
          cargo build --locked --release --package pqc_scan_cli
          python3 scripts/package-release.py --binary target/release/pqc-scan --variant static --out-dir target/task-038/static-first
          python3 scripts/package-release.py --binary target/release/pqc-scan --variant static --out-dir target/task-038/static-second
          cmp target/task-038/static-first/*.tar.gz target/task-038/static-second/*.tar.gz
          python3 tests/distribution/check-install.py target/task-038/static-first/*.tar.gz --out-dir target/task-038/static-install
      - name: Build and prepare combined probe snapshot
        run: |
          cargo build --locked --release --package pqc_scan_cli --features probe-tls,probe-ssh --target-dir target/probe-release-build
          python3 scripts/package-release.py --binary target/probe-release-build/release/pqc-scan --variant combined-probes --out-dir target/task-038/combined-first
          python3 scripts/package-release.py --binary target/probe-release-build/release/pqc-scan --variant combined-probes --out-dir target/task-038/combined-second
          cmp target/task-038/combined-first/*.tar.gz target/task-038/combined-second/*.tar.gz
          python3 tests/distribution/check-install.py target/task-038/combined-first/*.tar.gz --out-dir target/task-038/combined-install
      - name: Build and prepare all probes including SSH KEX
        run: |
          cargo build --locked --release --package pqc_scan_cli --features probe-tls,probe-ssh,probe-ssh-kex --target-dir target/all-probes-release-build
          python3 scripts/package-release.py --binary target/all-probes-release-build/release/pqc-scan --variant all-probes --out-dir target/task-038/all-first
          python3 scripts/package-release.py --binary target/all-probes-release-build/release/pqc-scan --variant all-probes --out-dir target/task-038/all-second
          cmp target/task-038/all-first/*.tar.gz target/task-038/all-second/*.tar.gz
          python3 tests/distribution/check-install.py target/task-038/all-first/*.tar.gz --out-dir target/task-038/all-install
      - name: Retain preparation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unpublished-macos-arm64-preparation
          path: |
            target/task-038/*-first/*
            target/task-038/*-install/INSTALL-RESULTS.json
          retention-days: 7
