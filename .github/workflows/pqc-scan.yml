name: pqc-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (explicit toolchain below)
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test report navigation and self-scan preparation
        run: node --test shell/*.test.cjs

      - name: Test baseline evaluator
        run: python3 -m unittest discover -s tests/quality -p 'test_*.py'

  protocols:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (explicit toolchain below)
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Prepare pinned protocol tools and dependency cache
        run: python3 tests/protocol/prepare-image.py --out-dir target/protocol-image
      - name: Verify kernel resource and filesystem boundaries
        env:
          PQC_RUN_CONTAINER_TESTS: '1'
          PQC_PROTOCOL_IMAGE_FILE: target/protocol-image/IMAGE.json
        run: python3 -m unittest discover -s tests/protocol -p 'test_*.py' -v
      - name: Build and test all features, previews and OpenSSH under the same confinement
        run: >-
          python3 tests/protocol/run-isolated.py --out-dir target/protocol-ci
          --image-file target/protocol-image/IMAGE.json --previews --ssh-kex
      - name: Test packaging bounds and exact-version notices
        run: python3 -m unittest discover -s tests/distribution -v
      - name: Preserve protocol evidence and synthetic reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pqc-optional-protocol-evidence
          if-no-files-found: error
          path: |
            target/protocol-ci/
            target/protocol-image/IMAGE.json
            target/protocol-image/prepare.log

  baseline:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (explicit toolchain below)
        with:
          toolchain: 1.93.1
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build baseline scanner
        run: cargo build --workspace --release --locked
      - name: Measure reviewed baseline without enforcing local signals
        run: >-
          python3 tests/quality/run.py
          --binary target/release/pqc-scan --build-profile release
          --out-dir target/quality-baseline --repeats 3 --warm-samples 3
      - name: Preserve baseline reports and measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pqc-quality-baseline
          if-no-files-found: error
          path: target/quality-baseline/

  scan:
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (explicit toolchain below)
        with:
          toolchain: 1.93.1

      - name: Build
        run: cargo build --workspace --release --locked

      - name: Run pqc-scan
        run: cargo run --locked --bin pqc-scan -- scan . --format sarif --out-dir ./pqc-report --rules-dir ./rules

      - name: Prepare actionable Code Scanning results
        run: >-
          node shell/prepare-code-scanning.cjs
          --input ./pqc-report/report.sarif
          --expectations docs/quality/SELF-SCAN-EXPECTATIONS.json
          --root .
          --output ./pqc-report/code-scanning.sarif
          --audit ./pqc-report/code-scanning-audit.json

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          sarif_file: ./pqc-report/code-scanning.sarif

      - name: Preserve full self-scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pqc-self-scan-evidence
          if-no-files-found: error
          path: |
            ./pqc-report/report.sarif
            ./pqc-report/code-scanning.sarif
            ./pqc-report/code-scanning-audit.json
            ./docs/quality/SELF-SCAN-EXPECTATIONS.json

      - name: Upload Dependency SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pqc-dependency-sbom
          path: ./pqc-report/dependency-sbom.json
