name: pqc-scan

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run tests
        run: cargo test --workspace

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test report navigation and self-scan preparation
        run: node --test shell/*.test.cjs

      - name: Test baseline evaluator
        run: python3 -m unittest discover -s tests/quality -p 'test_*.py'

  baseline:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build baseline scanner
        run: cargo build --workspace --release --locked
      - name: Measure reviewed baseline without enforcing unapproved budgets
        run: >-
          python3 tests/quality/run.py
          --binary target/release/pqc-scan --build-profile release
          --out-dir target/quality-baseline --repeats 3 --warm-samples 3
      - name: Preserve baseline reports and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pqc-quality-baseline
          if-no-files-found: error
          path: target/quality-baseline/

  scan:
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1

      - name: Build
        run: cargo build --workspace --release

      - name: Run pqc-scan
        run: cargo run --bin pqc-scan -- scan . --format sarif --out-dir ./pqc-report --rules-dir ./rules

      - name: Prepare actionable Code Scanning results
        run: >-
          node shell/prepare-code-scanning.cjs
          --input ./pqc-report/report.sarif
          --expectations docs/quality/SELF-SCAN-EXPECTATIONS.json
          --root .
          --output ./pqc-report/code-scanning.sarif
          --audit ./pqc-report/code-scanning-audit.json

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ./pqc-report/code-scanning.sarif

      - name: Preserve full self-scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pqc-self-scan-evidence
          if-no-files-found: error
          path: |
            ./pqc-report/report.sarif
            ./pqc-report/code-scanning.sarif
            ./pqc-report/code-scanning-audit.json
            ./docs/quality/SELF-SCAN-EXPECTATIONS.json

      - name: Upload Dependency SBOM
        uses: actions/upload-artifact@v4
        with:
          name: pqc-dependency-sbom
          path: ./pqc-report/dependency-sbom.json
