id: '070'
title: Present migration decisions in paired English and Japanese reports
type: improvement
priority: high
status: pending
owner: Main agent
phase: '6'
description: >
  Add the approved explicitly selected human decision view to the existing report
  system, reusing task-069 structured decisions. Keep English/Japanese meaning,
  uncertainty and actions consistent without changing default report behavior.
plan_reference: docs/roadmap/v0.4/ROADMAP.md
requirements_reference: docs/roadmap/v0.4/REQUIREMENTS.md
quality_requirements:
  - X03
depends_on:
  - '069'
target_components:
  - crates/pqc_scan_report/src/
  - crates/pqc_scan_cli/src/
  - docs/user/REPORTS.md
  - docs/user/REPORTS.ja.md
existing_assets:
  - E-COMPAT
  - E-OUTPUT
  - E-POLICY
problem:
  - Structured decision output alone does not deliver the human-readable migration guidance required by v0.4.
  - Existing default HTML has a different purpose and must not be repurposed implicitly.
acceptance:
  - 'X03: At least the approved opt-in bilingual Markdown view explains result, location, response, reason and next check; human and machine output agree on claims, uncertainty and scope.'
  - Complete D4-selected presentation only; any opt-in HTML follows the recorded decision rather than creating a new UI or changing default views.
  - Preserve evidence, missing information, urgency/readiness distinctions, localization-independent IDs and safe output handling without evaluating policy in writers.
  - Verify paired rendered output, escaping/privacy, terminology and applicable browser behavior against final source; update paired user documentation together.
deliverables:
  - tasks/070/TASK-070-RESULTS.md
  - tasks/070/evidence/
  - Approved paired decision views, affected user documentation and rendered/compatibility/browser evidence.
implementation_steps:
  - Confirm D4 scope and consume task-069 decisions and source references without recomputing them in a writer.
  - Add the explicitly selected Markdown view and only the additional presentation approved under D4.
  - Write natural Japanese with humanizer-jp and maintain factual parity with English and the structured output.
  - Verify output safety, escaping, meaningful next actions, unknown/blocked cases and unchanged default views.
  - Complete implementation review, required final checks and applicable real-browser observations, then test review and final-source binding.
testing_requirements:
  - Render paired cases including A01-A02, A07, A09-A15 and A17-A18, retaining scope, reason and uncertainty across formats.
  - Check generated English/Japanese output meaning, reference integrity, escaping, secret canaries and default-output compatibility.
  - Follow docs/agent/REPORTS.md for applicable layout, keyboard and loaded-offline checks using a dedicated loopback directory; missing required browser evidence prevents completion.
  - Apply relevant Rust/report/configuration checks and both independent review stages; source inspection is not rendered verification.
out_of_scope:
  - A new web application, new policy logic in renderers, arbitrary runtime translation and implicit default-report redesign.
risks:
  - Translation or summaries may turn unverified claims into verified usage or conceal urgency behind missing information.
  - Source/DOM assertions alone may miss a materially unusable rendered report.
approval_boundary:
  - Execution requires later selection and task-069 completion; the D4 presentation and output contract must already be recorded.
  - No support expansion, publication or storage-contract change beyond the approved scope is implied.
planning_record:
  date: '2026-11-18'
  scope: Definition only; no generated report, product UI or browser acceptance has been executed.
  work_packages: [W5]
  primary_requirements: [X03]
  supporting_requirements: []
  completion_evidence: Paired final rendered behavior, applicable browser checks, required tests and both review stages must establish X03; structured JSON alone is insufficient.
