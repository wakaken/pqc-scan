problem:
- The required new-language outcomes are not delivered by current seven-language source routing, limited normalization
  or dependency formats. Existing v0.4 correctness/privacy/contracts must remain intact.
acceptance:
- Reconcile every original clause, initial API/input row, scoped owner and unresolved condition against actual
  final-source implementation, applicable component/integration/browser evidence and the required reviews.
  Do not close on artifact counts or earlier done labels.
- Validate current complete rule population/source hashes, unique IDs, semantic snapshots, rationale/limits,
  positive/negative controls and legacy OpenSSL/custom-pack compatibility without rewriting historical 065
  or earlier audit evidence.
- Complete relevant shared-budget/malformed/unknown/strict-mode, private-data canary, old-seven-language/public
  API/output/held-input policy and packaging/feature regression checks.
- Execute the frozen before/after runtime/resource/output protocol with exact source/input/environment/denominators;
  preserve failures and state synthetic conformance versus real-world accuracy/human usefulness explicitly.
  No post-hoc numeric hard gate or score conclusion.
- Confirm every implementation task includes its tests/paired guides, all applicable verification categories
  and both independent review stages are valid on final source, and reviewer continuity remains within the
  same authorized-request budget.
- Record acceptance as unfinished if any mandatory item is failed, unknown, unavailable or deferred; identify
  the responsible dependency/attempts/unmet criteria and concrete action needed. Release/publication and unrestricted
  product quality remain separate.
deliverables:
- tasks/083/TASK-083-RESULTS.md
- tasks/083/evidence/
- The scoped behavior or feasibility deliverable, meaningful verification, affected documentation and applicable
  review evidence; no completion follows from registration.
implementation_steps:
- Pin final source and collect all prerequisite criteria, rule/corpus populations, evidence bindings and review
  decisions.
- Reconcile all 30 clauses and required matrix rows without changing criteria or historical measurements.
- Run required integrated compatibility/privacy/feature/package checks and frozen measurements; assess reused
  evidence after changes.
- Resolve in-scope discrepancies with responsible owners and existing reviewers, then record technical acceptance
  or specific unfinished work without generating unrelated tasks.
testing_requirements:
- Apply docs/agent/VERIFICATION.md for all affected categories, including targeted behavior, workspace tests,
  formatting/diff inspection, Clippy, applicable builds/features and package/dependency provenance checks;
  record actual commands/exits and final-source applicability.
- For executable changes, obtain implementation review after initial checks and combined-diff inspection, then
  test review after required tests. Reuse the same two stage reviewers within one authorized request; splitting
  tasks or PRs grants no additional identities.
- New source/rule/manifest coverage needs meaningful positive, negative, malformed/unknown, resource/position/identity
  and private-data controls. Browser acceptance uses docs/agent/REPORTS.md where presentation/interaction is
  affected.
- Verify all original L IDs and complete matrices, including global and language-scoped cases, current YAML
  rule populations, safety failures and invalid/unknown controls.
- Apply fixed-toolchain workspace/format/Clippy/build, affected optional-feature/protocol and grammar license/distribution
  checks; absent required CI/platform/browser evidence stays unexecuted.
- Bind every final assertion to source/config/input/time and actual command exit; expected-unknown cases are
  not missing evidence and baseline logs do not certify new behavior.
out_of_scope:
- Release/publication, new support/quality claims, outreach, human/scoring studies, unrelated remediation and
  automatic follow-up tasks.
risks:
- An API/library name, dependency or syntactic reference may be promoted beyond its assurance, or historical
  evidence may be mistaken for coverage of new final-source behavior.
approval_boundary:
- Definition and registration only under the 2026-11-24 steering; this task is not selected for execution.
  Dependencies must complete and later explicit task selection is required.
- Storage-format changes, high-risk architecture, unclear cryptographic logic and potentially incompatible
  rules require the applicable AGENTS human decision; routine choices within agreed scope do not create a new
  approval gate.
- No extra agents, release/push/publication, outreach, fees or unagreed scope/criteria changes. Review budget
  remains per authorized request.
