id: '045'
title: 重要判断の変異試験で既存テストの弱点を調べる
type: improvement
priority: high
status: pending
owner: Planner Agent
phase: '3'
description: 判定反転等を試し、検出できない変異とその意味を残す。
quality_alias: QAM-04
plan_reference: docs/quality/QUALITY-ROADMAP.md
requirements_reference: docs/quality/QUALITY-REQUIREMENTS.md
