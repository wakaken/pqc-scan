  delivery: Single task/commit unit covering API, CLI, tests and documentation; no A/B/C PR split.
  api: Private-field ScanDocument and coverage/diagnostic accessors, scan_repository_detailed, default detect_detailed adapter; legacy public structs and entrypoints retained.
