id: '044'
title: 到達率と追加検証手法の適用範囲を測る
type: improvement
priority: high
status: done
owner: Evaluator Agent
phase: '3'
description: 重要な未到達箇所を特定し、Miriや形式検証の適用可否も根拠付きで判断する。
quality_alias: QAM-03
plan_reference: docs/roadmap/v0.3/ROADMAP.md
requirements_reference: docs/roadmap/v0.3/REQUIREMENTS.md
quality_requirements:
- Q4-13
- Q4-16
depends_on:
- '041'
target_components:
- crates/
existing_assets:
- E41
problem:
- 到達位置とfeature別の測定
- 純RustとFFI/OS依存を分けた適用検討
acceptance:
- 'Q4-13: 取得可能なline/region/branchを区別し、安全上重要な未到達箇所と対象外理由を列挙'
- 'Q4-16: 適用可能な小範囲を試し、実行不能・費用過大なら根拠と代替検証を明記。導入数を目標にしない'
deliverables:
- target/quality-task-044/coverage-review.md
- target/quality-task-044/verification-feasibility.md
implementation_steps:
- 着手前に対象HEAD・既存証拠・対応範囲・費用を再確認する。
- 対応する要求の不足だけを既存の仕組みに追加する。計測結果・失敗・未実行理由を保存する。
- 実装変更にはAGENTS.mdの実装レビューと試験妥当性レビューを適用し、必要な検証後にEvaluatorが判定する。
testing_requirements:
- 受入条件ごとの正例・負例・境界例を既存試験に結び付け、手計算または独立した事実を正解とする。
- ソース・入力・工具・規則・コマンドと終了状態をhash付きで保存し、過去の記録を上書きしない。
risks:
- FFI・OS依存・feature差・nightly専用機能によって、取得した到達率の範囲を誤解しやすい。
- 既存証拠の再利用だけで新しい対象範囲を検証済みと誤認するおそれがある。
- 未実施や環境差を合格・製品退行と取り違えない。必要な追加工具は費用・版・権限・隔離を評価してから選ぶ。
approval_boundary:
- 検出規則・暗号判断・公開Schema・数値ハードゲート・正式サポートの意味変更は影響分析と承認後に行う。
- リモート設定変更・公開・merge・tag・実release署名は別の明示許可を要する。
planning_record:
  date: '2026-11-11'
