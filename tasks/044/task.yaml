ci_followup:
  failed_run: https://github.com/wakaken/pqc-scan/actions/runs/43382596747
  lifecycle: done -> in-progress（Linux CIのRSS回帰試験前提を修正）
  cause: wait4は子ごとだがexec前の親image由来RSS floorを含み得る。固定32MiB childが親より小さいと大小両childのpeakが同値になり試験が失敗。
  approach: 計測器や測定値は変えず、large childの実接触allocationを親SELF peakより大きくして、累積値への退行を引き続き検出する。Linux高RSS親でred/greenと通常suiteを確認し、既存二者の限定確認後CIを再実行する。
