problem:
  - Business-to-usage bindings and saved runtime inputs do not share an existing approved assessment contract.
  - Decision vocabulary, clocks, minimal inputs and evaluation independence must be specified before implementation.
acceptance:
  - Compare existing-format adapters, a small internal fact input and integrated-inventory migration; select the minimum sufficient approach with evidence and no assumed crate/model replacement.
  - Specify exact technical facts, capture gaps, clause/edition/errata mappings and v1-preserving catalog dispatch before dependent coding.
  - Resolve D1-D5 to the extent required by tasks 067-070, recording actual maintainer decisions for storage contracts, policy semantics, selected runtime scope and any gated repair; unresolved blocking decisions prevent completion.
  - Define the joint context/binding/precedence/clock contract, branch-minimum inputs, urgency/sufficiency/readiness semantics, reasons/actions and no-network saved-evidence workflow.
  - Specify Inventory v1 and TLS v1 ingestion, explicit unsupported-format behavior, and a documented D3 decision for SSH offers/KEX without changing probe support or publication status.
  - Freeze technical and policy expectations for A01-A18, including invalid/boundary cases, before new implementation observations; disclose source exposure and do not invent blind authorship or business truth.
  - Freeze R5 comparison methods, measures, participant roles, recruitment/resource plan, adjudication and tuning/holdout rules before results; identify D6 resources still required by task 071 without claiming they are secured.
  - Record D7 as a later score-adoption decision; neither contract approval nor this prerequisite task claims any product requirement implemented or any numerical score validated.
deliverables:
  - tasks/066/TASK-066-RESULTS.md
  - tasks/066/evidence/
  - Approved or explicitly blocked fact/input/context/report contracts, decision table, source mappings, acceptance expectations and frozen evaluation protocol linked from the results.
implementation_steps:
  - Read task-065 audit results and pin the fact sources and current contract limits.
  - Complete saved-format feasibility and classification mapping before defining dependent decision inputs.
  - Compare architecture choices and present concrete D1-D5 decisions with compatibility/security impacts.
  - Finalize minimal fields, system/usage bindings, precedence, time, versioning, output and error contracts after the required decisions.
  - Freeze the decision cases and bounded evaluation protocol; distinguish technical truth, implementation conformance and practitioner usefulness.
  - Record approvals, unresolved study resources and downstream obligations without creating product code, schemas or parallel knowledge documents unnecessarily.
testing_requirements:
  - Check the contracts against all detailed requirements and A01-A18; trace each field to a meaningful branch or provenance obligation.
  - Manually check same-algorithm/different-system bindings, unknown versus false, urgent-but-unready precedence, time boundaries and failed TLS verification.
  - Verify source/standard links, exact input versions, proposed limits, expected-case independence and absence of circular contracts.
  - Planning-only verification does not substitute for later executable, interoperability or practitioner evidence.
out_of_scope:
  - Product implementation, new stored schema files, automatic discovery, a generic policy language and multiple replacement evaluation engines.
risks:
  - A proposed contract may be treated as adopted without the required human decision.
  - A decision table or source-exposed dataset may be mistaken for independent evidence of operational usefulness.
approval_boundary:
  - Task execution requires a subsequent selection instruction; this registration does not settle D1-D7.
  - Obtain the actual AGENTS human review for gated architecture, storage, rule or unspecified cryptographic changes before dependent implementation.
  - Task 071 must secure D6 study resources before the affected evaluation; defining a recruitment plan is not resource confirmation.
