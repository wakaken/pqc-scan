id: '020'
title: Parse certificate and public-key attributes accurately
type: improvement
priority: high
status: done
owner: Evaluator Agent
phase: '0'
description: Implemented and locally validated certificate/public-key attributes, content-based format selection,
  bounded structural checks, bundle identity and safe detailed outcomes; independent review approved. Local commit
  only.
execution_plan: docs/roadmap/TASK-020-IMPLEMENTATION.md
authorization: User authorized task 020 implementation, compatibility checks, tests, documentation, review and local
  commit; no push or PR requested.
plan_reference: docs/roadmap/OSS-ROADMAP-v0.2.md#task-020
change_size: Medium; ASN.1 and fixture review
decision_gate: Review corrected cryptographic-attribute specification before implementation.
change_categories:
- Existing implementation correction
- Existing implementation extension
depends_on:
- 018
required_files:
- crates/pqc_scan_detectors/src/certificate_detector.rs
- crates/pqc_scan_core/src/classifier.rs
- README.md
- README.ja.md
implementation_steps:
- Reuse x509-parser/pem with content-based PEM/DER detection including .crt/.cer.
- Separate signature OID, SPKI type/parameters, RSA modulus bits, EC curve and encoded size.
- Retain public DER/SPKI fingerprints and object positions; report malformed/unsupported formats; expose narrow
  parser helpers for later TLS reuse.
out_of_scope:
- No private-key decryption, PKCS#12 passwords, signature/chain validation or new PKI framework.
risks:
- Corrected key evidence changes are intentional; unknown/PQC encodings cannot be treated as RSA.
acceptance:
- Known public fixtures yield correct semantic sizes and separate signature/subject-key attributes.
- Bundles retain distinct object identity and unsupported containers have explicit outcomes.
testing_requirements:
- RSA 1024/2048/3072, P-256, Ed25519, unknown/PQC OID, DER extension, malformed and bundle fixtures.
- Apply docs/quality/QUALITY-GATES.md; record exact HEAD, executed outcomes and unexecuted checks.
