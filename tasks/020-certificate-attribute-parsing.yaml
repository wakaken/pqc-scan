  delivery: One task/PR unit; local commit only, no push/PR/merge.
  attributes: Separate signature/SPKI OIDs; exact positive RSA modulus bits; known named EC field size; Ed/X lengths
    independent of semantic size; unknown/PQC values retain OID/fingerprints without RSA assumptions. Public helper
    results expose incomplete status.
  formats: Existing candidate suffixes retained; parse DER first, then independently framed PEM. PKCS#12/PFX interiors
    Unsupported; malformed/unknown/mixed attributes Partial. Valid neighbors retained; exact object positions and
    public certificate/SPKI SHA-256 recorded.
  structural_checks: Existing ASN.1 decoder plus bounded expected Certificate/TBS/validity/AlgorithmIdentifier/SPKI
    field checks reject ignored inner remainders; RSA sequence/integers consume exactly; Ed/X parameters/length
    and BIT STRING alignment checked. No signature/chain/mathematical-key validation.
  compatibility: CLI production, rule definitions/classification, core finding-ID/dedup logic, report structures
    and schema versions unchanged. Corrected certificate sizes/evidence/PEM positions intentionally affect findings/IDs.
    Only workspace-pinned sha2/hex dependencies reused. Classifier inspected and unchanged.
  privacy: Reproduced EC private PEM canary in certificate-container source snippets; extended only file-wide masking
    to EC/DSA/encrypted markers. No new key detection rule or private-key decoder.
