id: '049'
title: 隔離TLS/SSH診断の観測・認証・失敗を検証する
type: improvement
priority: high
status: done
owner: Main agent (Evaluator)
phase: '4'
description: 既存local peersと隔離runnerで要件と試験の対応を埋める。probeは実験的のまま扱う。
quality_alias: QAM-07
plan_reference: docs/quality/QUALITY-ROADMAP.md
requirements_reference: docs/quality/QUALITY-REQUIREMENTS.md
quality_requirements:
- Q3-06
- Q4-08
- Q4-09
- Q4-10
- Q4-11
- Q4-12
depends_on:
- '048'
- '057'
target_components:
- tests/protocol/
existing_assets:
- EP
problem:
- 観測状態と判断の対応表
- client profile/provider/RFC9846差分の網羅表
- trust/name/expiry/mTLS/HRR/refused/timeout/巨大messageの対応
- peer設定と観測・認証状態の対応
- 送信packet種別と全失敗経路の対応
- fragment/巨大/途中切断・接続拒否を含む全対応
acceptance:
- 'Q3-06: 未認証offerを実交渉や認証成功へ昇格させない'
- 'Q4-08: 実交渉groupを確認し、cipherや設定名から推測しない。未知groupは不明のまま保持'
- 'Q4-09: 検証失敗で成功済み暗号事実を捏造せず、各状態と限界を記録'
- 'Q4-10: pin不一致・unknown/古典/hybridを分け、未認証情報と検証済み事実を区別'
- 'Q4-11: service/userauth/channel/commandを送らず切断することを実peerで確認'
- 'Q4-12: 割当て前の長さ検査、有限の通信/時間/接続数、中止と後始末を検証'
deliverables:
- target/quality-task-049/protocol-assurance.json
- target/quality-task-049/ssh-failures.json
- target/quality-task-049/ssh-matrix.json
- target/quality-task-049/ssh-no-auth.json
- target/quality-task-049/tls-failures.json
- target/quality-task-049/tls-matrix.json
implementation_steps:
- 着手前に対象HEAD・既存証拠・対応範囲・費用を再確認する。
- 対応する要求の不足だけを既存の仕組みに追加する。計測結果・失敗・未実行理由を保存する。
- 実装変更にはAGENTS.mdの実装レビューと試験妥当性レビューを適用し、必要な検証後にEvaluatorが判定する。
testing_requirements:
- 受入条件ごとの正例・負例・境界例を既存試験に結び付け、手計算または独立した事実を正解とする。
- ソース・入力・工具・規則・コマンドと終了状態をhash付きで保存し、過去の記録を上書きしない。
risks:
- 提示方式を実交渉済みと誤認したり、試験時に認証・外部接続へ進んだりする危険がある。
- 既存証拠の再利用だけで新しい対象範囲を検証済みと誤認するおそれがある。
- 未実施や環境差を合格・製品退行と取り違えない。必要な追加工具は費用・版・権限・隔離を評価してから選ぶ。
approval_boundary:
- 検出規則・暗号判断・公開Schema・数値ハードゲート・正式サポートの意味変更は影響分析と承認後に行う。
- リモート設定変更・公開・merge・tag・実release署名は別の明示許可を要する。
planning_record:
  date: '2026-11-11'
  scope: 今回の依頼は計画とタスク整理のみ。実装・工具導入・製品測定は未着手。
  evidence_scope: 参照先は既存実装と過去の限定された証拠。新タスクの実行成功を意味しない。
  completion_evidence: 全quality_requirementsの成果物・コマンド/状態・レビュー・対象版の証拠が必要。Unknown/Not Testedを残しただけでは実装完了にしない。

execution_record:
  date: '2026-11-14'
  source_head: b0e386e9d8503cf422c310e85fbb2a429bfb57d2
  authorization: 既存計画・元の6条件の実装、検証、二段階レビュー。
  approach: 既存TLS local peersとOpenSSH、strict runnerを再利用し、対応表・生の観測・失敗時のpeer受信記録を集約する。
  alternatives: 新規暗号実装や対向の全面再実装は不要。既存ログのみの再掲では最終ソースとの対応と不足ケースを確認できない。
  steps:
  - TLS1.2/1.3・classical/hybrid・provider/profile・unknown・RFC9846差分を整理し、実交渉と未完了を記録。
  - SSH offersとpin検証付きKEX、失敗・上限・中止を実peerの送信/受信と照合。
  - 外部通信なし・有限資源の既存container内で測定し、6成果物とsource/input/tool/log hashを保存。
  - 対象試験と通常/全機能の必要な検証、実装レビュー・試験レビュー後に元条件を判定。
  constraints: 実験的probe・公開Schema・暗号判断・CI protocols停止を維持する。実外部診断と認証・コマンド実行は行わない。
  cost: 既存の固定Rust/OpenSSH工具イメージとCargo cacheを再利用。新規製品依存なし。非root・network none・6GiB/2CPU/128PID/4GiB tmpfs・実行1200秒上限。
  reviewers:
    implementation:
      id: /root/quality049_implementation_review
      source_manifest: target/quality-task-049/REVIEW-SOURCE-R2.json
      outcome: R1とR2の集約修正・profile文書を受入。追加必須指摘なし。
    test:
      id: /root/quality049_test_review
      source_manifest: target/quality-task-049/REVIEW-SOURCE-R3.json
      outcome: 元6条件・最終ソース/入力/出力/peer記録とログを照合して受入。追加必須指摘なし。
final_acceptance:
  date: '2026-11-14'
  source_head: b0e386e9d8503cf422c310e85fbb2a429bfb57d2
  source_scope: HEADと049の未コミット差分。最終hashは保存証拠FINAL-SOURCE.json。
  evidence: docs/quality/task049-20261114/
  result: docs/quality/TASK-049-RESULTS.md
  requirements:
    Q3-06: not_observed/peer_claim_only/未認証offer/検証済みKEXを区別し、昇格を拒否。
    Q4-08: TLS1.2/1.3・固定providerの4groups・HRR・同suite異group・unknown単体対照とRFC差分を確認。
    Q4-09: 信頼/名前/期限/有効開始前、mTLS、収集/message上限、接続拒否/期限/中止/巨大/途中recordを区別。
    Q4-10: OpenSSHで古典/hybrid offers、pin成功/不一致/署名改変/no-overlapを確認。
    Q4-11: raw peer26枠・OpenSSH7枠の実受信種別から、service/userauth/channel/commandなしを確認。
    Q4-12: parserの正負/境界と実IOの制限、期限、中止、単一接続、close/join/container削除を確認。
  verification:
    strict_final: confined-r2全11コマンド終了0、sourceBeforeAfterMatch/containerRemoved=true。
    default: Rust544成功・3ignored、clippy/build/fmt終了0。
    all_features: Rust603成功・5ignored、clippy/build終了0。ignored OpenSSH試験は別に明示起動して成功。
    host: Python80成功、container host境界4成功、SSHruntimeのみ1成功、全機能clippy終了0。
  history: confined-r1の最後の集約で不完全offersのassuranceを誤判定。製品/試験コマンドは成功。期待値の回帰試験を追加・修正後にconfined-r2を全再実行し成功。旧証拠は保持。
  limitations:
  - 固定providerと有限local peers、Linux arm64隔離実行・macOS対象検証。全OS/全入力の認定ではない。
  - TLS未知groupは検証後のアクセサー単体対照。実接続成功とは扱わない。
  - TLS対向も同じrustls系。RFC9846のprofile差分整理であり、全条項への適合認定ではない。
  - 今回commit/push/PR/merge/releaseとCI実行は行っていない。protocols停止は維持。
