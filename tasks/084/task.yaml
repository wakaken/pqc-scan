plan_reference: tasks/084/TASK-084-PLAN.md
acceptance:
  - Pin all 30 requested repositories, source trees, commits, licenses and acquisition limitations without executing target code or committing upstream sources.
  - Scan all 30 and evaluate classical, PQC and hybrid references, purposes, API/direct-implementation/dependency classes, false positives, misses, duplicates, risk judgments and evidence coordinates against source and official specifications.
  - Preserve source-derived truth, exposure, eligible scope and annotation completeness; calculate Precision, Recall and F1 only for frozen eligible units and never claim repository-wide accuracy from partial annotation.
  - Account separately for PHP, C, C++, C#, ambiguous headers, performance, memory, failures, Partial, Unsupported and excluded files.
  - Diagnose observed defects, implement necessary generic specification-based improvements with meaningful regressions, and verify existing-language compatibility.
  - Rescan every pinned repository after improvements and compare identical truth, inputs, rules/configuration and measurement conditions, explicitly accounting for justified versioned amendments.
  - Report all per-project and stratified findings, before/after metrics, improvements, stability, unresolved risks and concrete proposals; finish applicable tests and both required independent review stages for executable changes.
constraints:
  - Main agent owns all investigation, labeling, evaluation, implementation, tests and documentation. At most one implementation reviewer and one test reviewer for this combined request; no additional annotators or delegated work.
  - No target build, installation, execution, dependency resolution, Git hooks, submodule recursion or LFS hydration. Preserve user edits and historical evidence. No commit, push, PR, release or publication.
  - Preserve public output/storage contracts, historical rule semantics and cryptographic integrity. Apply AGENTS human-review gates to affected changes.
  - Existing task023 independent-label and MIT materialization contracts remain unchanged; this separate exploratory study discloses single-author source-first annotations and does not claim independent holdout validity.
implementation_steps:
  - Freeze actual dirty source, rules, binary and environment; restore existing acceptance and quality infrastructure.
  - Acquire and pin the 30 public upstream trees externally, review licenses and source-derived crypto characteristics, and freeze the measurement/annotation protocol.
  - Prepare source-first bounded truth and inspection accounting, run baseline scans, evaluate and diagnose findings.
  - Add generic fixes and regression controls where supported by evidence, then perform implementation review and applicable verification.
  - Rescan all pinned inputs, finalize comparison and test review, and reconcile every original acceptance criterion.
