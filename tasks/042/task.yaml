problem:
- 評価範囲を広げたときの分母と重複所見の扱い
- 他100ルールと新たな入力系統の検証
- RSA/DSA/ECDSA/ECDH/DH/EdDSA/ML-KEM/ML-DSA/SLH-DSA・hybrid・旧称・unknownの正解分類
- 署名・鍵交換・KEM・暗号化・JWT等の用途別分類
- 形式・版・利用形態を組み合わせた評価の不足
- コメント・文字列・同名関数・alias・shadowing・動的指定・未使用コード・無効設定・混在・同一行複数・型/引数・構文破損の不足セル
- 追加データの由来・版・独立性の確認
- 新たな独立評価とデータ版が違う場合の比較
- 追加分類・データ相関・評価費用の確認
acceptance:
- 'Q1-01: 手計算の正負・重複・分母0の例と一致し、全ての率に分母を付す'
- 'Q1-02: 対応範囲の全ルールを評価済み・未評価・対象外に分類し、空の層を隠さない'
- 'Q1-03: 各方式・パラメータの正負または対応外理由をレビューし、出力を見る前に正解を固定'
- 'Q1-04: 参照と実行を分け、各用途の評価単位・適格数・誤検出を報告'
- 'Q1-05: 各対応形式の正負と破損例を含め、未対応を負例にしない'
- 'Q1-06: 各ケースを対応表に載せ、未実行セルと既知FP/FNを残す。件数だけで受け入れない'
- 'Q1-07: 出力非参照の作成・二者ラベル・裁定・系統監査・固定時点・ライセンスを記録'
- 'Q1-09: 同一入力差分と新データの結果を別掲し、調整に使ったholdoutを独立評価と呼ばない'
- 'Q1-10: 評価器と正解を別々にレビューし、少数母数・同系統重複・未評価範囲と追加件数の根拠を説明'
