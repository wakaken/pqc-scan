problem:
- The required new-language outcomes are not delivered by current seven-language source routing, limited normalization
  or dependency formats. Existing v0.4 correctness/privacy/contracts must remain intact.
acceptance:
- Pin all four grammar candidates and validate compatibility with Rust 1.93.1 / Tree-sitter 0.26.6, supported platform
  build assumptions and required syntax in isolated feasibility checks; record actual failures and alternatives
  without installing or executing scanned projects.
- Freeze every mandatory API, parameter set, operation/reference boundary and dependency-input edition from ROADMAP.md
  with official source tags/commits; retain every required family and explicitly record unsupported/dynamic limits.
- Reconcile current v0.4 SourceMatch.algorithm_references, with_algorithm_references, dependency context and committed
  073/074 helpers before deciding any additional interface; preserve public structs and stored contracts.
- Freeze independently specified synthetic positive/negative/boundary expectations and existing-seven-language/saved-evidence
  baseline inputs before observing the new implementation. Disclose the earlier source-exposed routing draft; it
  is not blind validation.
- Freeze fixed-condition runtime/resource/output measurement method, denominators, source/environment/feature bindings
  and interpretation before observations; do not invent numeric gates, human-study resources or new scoring.
- Identify actual AGENTS human-review decisions only where storage, high-risk architecture, unclear cryptographic
  logic or potentially incompatible rules require them; unresolved dependent decisions prevent closing the affected
  feasibility deliverable.
deliverables:
- tasks/076/TASK-076-RESULTS.md
- tasks/076/evidence/
- The scoped behavior or feasibility deliverable, meaningful verification, affected documentation and applicable
  review evidence; no completion follows from registration.
implementation_steps:
- Read current source, complete initial matrix and prior research; bind the exact baseline and existing evidence.
- Run bounded scratch grammar/API/input feasibility checks without changing shipped product code or Cargo dependencies;
  retain source/command/exit and alternatives.
- Record minimal interfaces and source-role/capture limits using existing v0.4 mechanisms.
- Freeze corpus/expectations and comparison protocol, identify unresolved decisions and record readiness or blockers
  for dependent tasks.
testing_requirements:
- Prose-only feasibility/specification work needs source/reference/coverage checks; actual isolated executable feasibility
  checks require recorded toolchain/input/command/exit evidence and applicable review rules.
- Check every required source/API/input row has a source-bound positive and negative expectation, explicit status
  and downstream identity/unknown outcome.
- Check below/at/above grammar/syntax/resource assumptions, old-language fixtures, source exposure and no circular
  ownership.
- Preserve actual scratch build/test results; package existence, documentation or the earlier baseline run does
  not establish new-language compatibility.
out_of_scope:
- Shipped product/rule/schema changes, full new-language implementation, release/publication and external contact.
risks:
- An API/library name, dependency or syntactic reference may be promoted beyond its assurance, or historical evidence
  may be mistaken for coverage of new final-source behavior.
approval_boundary:
- Definition and registration only under the 2026-11-24 steering; this task is not selected for execution. Dependencies
  must complete and later explicit task selection is required.
- Storage-format changes, high-risk architecture, unclear cryptographic logic and potentially incompatible rules
  require the applicable AGENTS human decision; routine choices within agreed scope do not create a new approval
  gate.
- No extra agents, release/push/publication, outreach, fees or unagreed scope/criteria changes. Review budget remains
  per authorized request.
