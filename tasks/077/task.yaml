problem:
- The required new-language outcomes are not delivered by current seven-language source routing, limited normalization
  or dependency formats. Existing v0.4 correctness/privacy/contracts must remain intact.
acceptance:
- Adopt only the exact feasible grammar pins and interfaces established by 076; preserve the fixed toolchain and
  existing detector entrypoints.
- Route PHP/PHTML/tagged INC, C# CS, C and C++ extensions including uppercase .C before lowercasing; bounded ambiguous-header
  behavior cannot combine conflicting bindings or duplicate one lexical occurrence.
- Preserve exact original spans and encoded/Unicode positions and diagnose parse errors, template limits and budget
  exhaustion; generic/custom AST rules continue to use the documented matching path.
- Reuse current typed algorithm references first; any necessary additive internal capture validates finite identifiers/parameters
  and keeps ast_pattern/syntactic/referenced assurance. No mandatory public struct fields or serialized format change.
- Ship routing/capture positive, negative, same-line, malformed, unknown, budget and privacy tests plus affected
  paired user scope documentation; future source handlers must not be advertised complete by this foundation.
deliverables:
- tasks/077/TASK-077-RESULTS.md
- tasks/077/evidence/
- The scoped behavior or feasibility deliverable, meaningful verification, affected documentation and applicable
  review evidence; no completion follows from registration.
implementation_steps:
- Write observable failing routing/capture tests from frozen 076 expectations.
- Add minimal pinned grammars, extension/semantic-node adapters and bounded header policy.
- Extend safe typed capture only where current v0.4 interfaces are insufficient, preserving old behavior.
- Run relevant component and existing-language regression tests, update affected documentation and record final-source
  evidence.
testing_requirements:
- Apply docs/agent/VERIFICATION.md for all affected categories, including targeted behavior, workspace tests, formatting/diff
  inspection, Clippy, applicable builds/features and package/dependency provenance checks; record actual commands/exits
  and final-source applicability.
- For executable changes, obtain implementation review after initial checks and combined-diff inspection, then test
  review after required tests. Reuse the same two stage reviewers within one authorized request; splitting tasks
  or PRs grants no additional identities.
- New source/rule/manifest coverage needs meaningful positive, negative, malformed/unknown, resource/position/identity
  and private-data controls. Browser acceptance uses docs/agent/REPORTS.md where presentation/interaction is affected.
- Exercise real detector/inventory behavior for all four grammars, mixed PHP, modern C#, .c/.C/.h routing, duplicate
  spans and custom-scope controls.
- Check malformed/unsupported/encoded inputs and shared budget boundaries; preserve incomplete inspection and private-data
  masking.
out_of_scope:
- Full language-specific API packs, dependency-manager execution, unapproved schema/public-API break and language
  completion claims from parser presence alone.
risks:
- An API/library name, dependency or syntactic reference may be promoted beyond its assurance, or historical evidence
  may be mistaken for coverage of new final-source behavior.
approval_boundary:
- Definition and registration only under the 2026-11-24 steering; this task is not selected for execution. Dependencies
  must complete and later explicit task selection is required.
- Storage-format changes, high-risk architecture, unclear cryptographic logic and potentially incompatible rules
  require the applicable AGENTS human decision; routine choices within agreed scope do not create a new approval
  gate.
- No extra agents, release/push/publication, outreach, fees or unagreed scope/criteria changes. Review budget remains
  per authorized request.
