id: '075'
title: Evaluate assisted input workflows and reconcile expanded v0.4 acceptance
type: improvement
priority: high
status: pending
owner: Main agent
plan_reference: docs/roadmap/v0.4/ROADMAP.md
requirements_reference: docs/roadmap/v0.4/REQUIREMENTS.md
description: Evaluate the added workflow and establish expanded final-source acceptance without replacing
  original mandatory evaluations.
quality_requirements:
- U08
- U09
depends_on:
- '071'
- '072'
- '074'
target_components:
- tests/quality/
- docs/quality/
- docs/roadmap/v0.4/
problem:
- Original acceptance evidence does not cover the added assisted-input workflow or demonstrate its usability.
acceptance:
- 'U08: Freeze a bounded workflow-comparison protocol before observations; compare manual-JSON and assisted
  personal/organization scenarios using actual CLI/browser operations. Record completion, time, errors,
  skipped/unknown answers and next-action checks with denominators, operator authorship/exposure, failures
  and limitations. These controlled observations do not establish independent human usefulness. Reuse
  task071 practitioner evidence only when applicable; no additional recruitment is required or authorized.
  Original task 071 study remains mandatory.'
- 'U09: After tasks 071/072/074, reconcile all original 30 and added 9 clauses against final-source implementation,
  applicable tests/browser/study evidence and reviews. Original task 072 completion covers its original
  scope only; preserve historical records and separately bind new evidence. Release/support and numerical
  adoption remain separate.'
deliverables:
- tasks/075/TASK-075-RESULTS.md
- tasks/075/evidence/
- Frozen added workflow protocol, actual operator observations with limitations, all 39-row reconciliation
  and applicable review records.
implementation_steps:
- Preserve task071 original protocol/results and task072 original reconciliation; freeze a bounded, versioned
  workflow-comparison supplement before observations. Do not add a recruitment prerequisite or claim independent
  usefulness from author-run observations.
- Run personal/organization manual-versus-assisted scenarios with actual CLI/browser operations; retain
  raw timing/error/completion/unknown/next-action checks, operator authorship/exposure, failures and denominators.
  Reuse071 practitioner evidence only when applicable; do not fabricate benefit.
- Extend existing QAM/evidence aggregation only as necessary; assess all 39 requirement clauses against
  final source, old/new workflows, actual browser evidence and applicable reviewer records.
- Report fulfilled and unmet clauses explicitly; missing mandatory study or implementation evidence prevents
  closure. Keep product acceptance, support, numerical adoption and release separate.
testing_requirements:
- Apply docs/agent/VERIFICATION.md and both independent review stages for executable changes; reuse reviewer
  identities within the authorized request and retain source/input/context/version/time bindings.
- Check actual generated/imported configurations, exact target scope, missing/unknown/false/N/A, stale
  claims, substitution and invalid input; do not silently create positive claims.
- Verify CLI/template/web agreement for identical inputs where applicable; preserve v1, 0.45, scan/report
  defaults and no-outbound reassessment.
- Verify raw-to-summary consistency and evidence applicability for every original 30 and added 9 row;
  missing or failed required observations remain unfinished.
out_of_scope:
- No rewriting completed records, replacing task 071 with a UI study, skipping task 072, invented participants,
  automatic numerical scoring, outreach, release or publication.
risks:
- UI convenience can invent facts, widen target scope, erase unknowns or falsely imply verified readiness;
  prior accepted evidence may be inapplicable after integration.
approval_boundary:
- Registration only; execution requires later selection and completed dependencies. Record D4 details
  before affected implementation; any storage-contract or high-risk architectural change requires the
  applicable human decision.
- No external contact, fees, release or publication is authorized. Missing required evaluation resources
  keep affected work unfinished.
planning_record:
  date: '2026-11-18'
  scope: Definition only; no implementation, product execution or measurement selected.
  primary_requirements:
  - U08
  - U09
  supporting_requirements: []
  completion_evidence: Original criteria, applicable tests, final-source evidence and required reviews
    must all be complete; completed historical tasks remain unchanged.
