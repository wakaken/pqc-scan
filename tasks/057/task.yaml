problem:
- 故障・異常入力の横断試験表
- 対象処理別の上限・実行証拠の対応
- 全収集経路から全出力・ログまでの対応表
- OS差・競合・特殊ファイルの要件表
- オフラインscan/名前解決/接続先/準備工程の対応
acceptance:
- 'Q4-01: 終了状態を区別し、hangを時間内に停止、panicや結果消失を個別報告'
- 'Q4-02: 準備と対象実行を分離し、子プロセスを含む上限と終了後の後始末を検証'
- 'Q4-04: 合成秘密の流出と例外時漏洩を検証し、パス等の対象外範囲を明記'
- 'Q4-06: 対象外読み取りとブロックを防ぎ、hard link/内容同時変更等の限界を明示'
- 'Q4-07: 静的scanの外部通信なしとprobeの明示先・許可CIDR・固定IP・中止を試験'
deliverables:
- target/quality-task-057/failure-matrix.json
- target/quality-task-057/filesystem-safety.json
- target/quality-task-057/network-boundary.json
- target/quality-task-057/privacy-matrix.json
- target/quality-task-057/resource-boundary.json
implementation_steps:
- 着手前に対象HEAD・既存証拠・対応範囲・費用を再確認する。
- 対応する要求の不足だけを既存の仕組みに追加する。計測結果・失敗・未実行理由を保存する。
- 実装変更にはAGENTS.mdの実装レビューと試験妥当性レビューを適用し、必要な検証後にEvaluatorが判定する。
testing_requirements:
- 受入条件ごとの正例・負例・境界例を既存試験に結び付け、手計算または独立した事実を正解とする。
- ソース・入力・工具・規則・コマンドと終了状態をhash付きで保存し、過去の記録を上書きしない。
risks:
- 一部のOSだけの成功を全環境へ一般化したり、例外経路の結果消失・漏洩を見逃したりするおそれがある。
- 既存証拠の再利用だけで新しい対象範囲を検証済みと誤認するおそれがある。
- 未実施や環境差を合格・製品退行と取り違えない。必要な追加工具は費用・版・権限・隔離を評価してから選ぶ。
approval_boundary:
- 検出規則・暗号判断・公開Schema・数値ハードゲート・正式サポートの意味変更は影響分析と承認後に行う。
- リモート設定変更・公開・merge・tag・実release署名は別の明示許可を要する。
planning_record:
  date: '2026-11-11'
  scope: 今回の依頼は計画とタスク整理のみ。実装・工具導入・製品測定は未着手。
  evidence_scope: 参照先は既存実装と過去の限定された証拠。新タスクの実行成功を意味しない。
  completion_evidence: 全quality_requirementsの成果物・コマンド/状態・レビュー・対象版の証拠が必要。Unknown/Not Testedを残しただけでは実装完了にしない。

