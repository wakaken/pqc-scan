acceptance:
- 'Q6-01: 既存jobを再利用し、PRの軽量検証と高コスト測定を分け、全軸の証拠を保存'
- 'Q6-02: 最終ソースに結ぶ結果を保存し、ログ成功だけで試験妥当性を合格にしない'
- 'Q6-16: 全要求IDと実行/未実行・根拠hashを機械的に参照でき、工具障害と製品退行を分離'
- 'Q6-18: 対象commit/版・機能範囲・規格・方法・環境・実測・Q1〜Q6・制約/未確認・重大懸念・過去比較・優先順位・受入判定を入力/コマンド/成果物へ結ぶ。機械JSONと人向け報告の事実が一致'
deliverables:
- target/quality-task-053/ci-measurement-plan.md
- target/quality-task-053/quality-assessment.md
