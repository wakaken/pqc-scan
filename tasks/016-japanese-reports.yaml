id: "016"
title: Add readable Japanese HTML and Markdown reports
type: feature
priority: high
status: cancelled
owner: Planner Agent
description: >
  Add --lang en|ja (default en) for human-facing HTML and Markdown reports.
  Preserve machine output, source evidence, identifiers and English defaults.
  Use the installed humanizer-jp skill to review neutral, concrete Japanese copy.
implementation_steps:
  - Add failing report and CLI tests for Japanese output and English compatibility.
  - Add a deterministic Japanese presentation catalog for all built-in rules and actions.
  - Render Japanese labels, explanations, risk meanings and next steps without changing source evidence.
  - Preserve untranslated custom text with an explicit notice rather than guessing its meaning.
  - Update both READMEs and generate Japanese sample reports.
testing_requirements:
  - cargo build --workspace
  - cargo fmt --all --check
  - cargo test --workspace
  - cargo clippy --workspace --all-targets -- -D warnings
  - Verify built-in translation coverage, masking, escaping, unchanged machine output and English defaults
  - Review generated Japanese samples for factual certainty and readability
security_considerations:
  - Do not send repository contents to a translation service or use runtime LLM calls.
  - Preserve masking, code, paths, URLs and cryptographic identifiers.
acceptance:
  - HTML and Markdown can be generated with --lang ja.
  - Findings and recommended actions use reviewed Japanese text.
  - Machine outputs and detection logic are independent of report language.
  - Custom rules without Japanese copy are explicitly identified and retain original text.
