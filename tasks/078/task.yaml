problem:
- The required new-language outcomes are not delivered by current seven-language source routing, limited normalization
  or dependency formats. Existing v0.4 correctness/privacy/contracts must remain intact.
acceptance:
- Implement the PHP scope of L03-L07 for every required OpenSSL/Sodium/ParagonIE/phpseclib family in ROADMAP.md;
  integrate names, literal parameters and bounded receiver facts rather than only API-name regexes.
- Handle qualified use/use-function aliases, namespaces, fallback, local namesakes, shadowing and reassignment within
  the frozen subset. Dynamic functions, reflection, FFI and arbitrary cross-file bindings remain unresolved.
- Generic openssl_sign/verify or imported keys do not assert RSA; KEM, signatures, encryption and DH/ECDH derivation
  stay distinct. No AES or password-hash public-key migration finding is invented.
- Keep Sodium pure ML-KEM-768 and X-Wing separate; capture ParagonIE exact primitive/parameter names and required
  reference-only rows without assuming native/polyfill capability parity or runtime availability.
- Add unique scoped rules, per-rule rationale/limits/source-bound quality rows, positive/negative detector cases
  and paired PHP user documentation; preserve custom-rule and secret-handling contracts. Full L03-L07 closure belongs
  to 082 after all language slices.
deliverables:
- tasks/078/TASK-078-RESULTS.md
- tasks/078/evidence/
- The scoped behavior or feasibility deliverable, meaningful verification, affected documentation and applicable
  review evidence; no completion follows from registration.
implementation_steps:
- Write frozen PHP positive/negative/namesake/scope/receiver/parameter fixtures before implementation.
- Add minimal PHP grammar-aware scope/binding and required API rules through existing dispatch.
- Verify safe canonical inventory facts or explicit unknowns, exact spans/counts, dynamic/rebound controls and partial
  status.
- Ship current rule-quality updates and paired documentation with targeted and applicable regression evidence.
testing_requirements:
- Apply docs/agent/VERIFICATION.md for all affected categories, including targeted behavior, workspace tests, formatting/diff
  inspection, Clippy, applicable builds/features and package/dependency provenance checks; record actual commands/exits
  and final-source applicability.
- For executable changes, obtain implementation review after initial checks and combined-diff inspection, then test
  review after required tests. Reuse the same two stage reviewers within one authorized request; splitting tasks
  or PRs grants no additional identities.
- New source/rule/manifest coverage needs meaningful positive, negative, malformed/unknown, resource/position/identity
  and private-data controls. Browser acceptance uses docs/agent/REPORTS.md where presentation/interaction is affected.
- Exercise each required PHP source family, aliases, function/class namesakes, unknown key type, local writes, mixed
  HTML/PHP, help strings/comments and source-order limits.
- Verify classical/PQC/draft/hybrid distinctions, API/reference strength, private-key/credential canaries and unchanged
  existing-rule behavior.
out_of_scope:
- Executing PHP/templates/FFI/Composer, universal phpseclib/wrapper support, dependency parser implementation owned
  by 081, and broader surveyed APIs outside the matrix.
risks:
- An API/library name, dependency or syntactic reference may be promoted beyond its assurance, or historical evidence
  may be mistaken for coverage of new final-source behavior.
approval_boundary:
- Definition and registration only under the 2026-11-24 steering; this task is not selected for execution. Dependencies
  must complete and later explicit task selection is required.
- Storage-format changes, high-risk architecture, unclear cryptographic logic and potentially incompatible rules
  require the applicable AGENTS human decision; routine choices within agreed scope do not create a new approval
  gate.
- No extra agents, release/push/publication, outreach, fees or unagreed scope/criteria changes. Review budget remains
  per authorized request.
