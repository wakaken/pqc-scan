id: '061'
title: 配布物の完全性・署名・生成来歴の検証を準備する
type: improvement
priority: high
status: pending
owner: Planner Agent
phase: '5'
description: 取得後の改変検出と署名/provenance検証を試す。公開や実release署名の権限は含めない。
quality_alias: '追加: Q6配布の信頼性'
plan_reference: docs/roadmap/v0.3/ROADMAP.md
requirements_reference: docs/roadmap/v0.3/REQUIREMENTS.md
quality_requirements:
- Q6-14
- Q6-15
depends_on:
- '051'
- 059
target_components:
- scripts/package-release.py
existing_assets:
- ED
- ER
problem:
- 取得後の改変検出・release manifestの確認
- 鍵・権限・provenance・署名検証の設計と試行
acceptance:
- 'Q6-14: binary/rules/noticesをhashで結び、欠落/改変/混在を受け手の検証手順で拒否'
- 'Q6-15: 認証情報を記録せず、準備物の署名/検証と改変拒否を隔離試行。公開・tag・実release署名は別承認'
deliverables:
- target/quality-task-061/artifact-integrity.json
- target/quality-task-061/release-provenance.md
implementation_steps:
- 着手前に対象HEAD・既存証拠・対応範囲・費用を再確認する。
- 対応する要求の不足だけを既存の仕組みに追加する。計測結果・失敗・未実行理由を保存する。
- 実装変更にはAGENTS.mdの実装レビューと試験妥当性レビューを適用し、必要な検証後にEvaluatorが判定する。
testing_requirements:
- 受入条件ごとの正例・負例・境界例を既存試験に結び付け、手計算または独立した事実を正解とする。
- ソース・入力・工具・規則・コマンドと終了状態をhash付きで保存し、過去の記録を上書きしない。
risks:
- 信頼根・署名者権限・生成来歴が不明なままhashや署名の存在だけで配布物を信頼してしまうおそれがある。
- 既存証拠の再利用だけで新しい対象範囲を検証済みと誤認するおそれがある。
- 未実施や環境差を合格・製品退行と取り違えない。必要な追加工具は費用・版・権限・隔離を評価してから選ぶ。
approval_boundary:
- 検出規則・暗号判断・公開Schema・数値ハードゲート・正式サポートの意味変更は影響分析と承認後に行う。
- リモート設定変更・公開・merge・tag・実release署名は別の明示許可を要する。
planning_record:
  date: '2026-11-11'
  scope: 今回の依頼は計画とタスク整理のみ。実装・工具導入・製品測定は未着手。
  evidence_scope: 参照先は既存実装と過去の限定された証拠。新タスクの実行成功を意味しない。
  completion_evidence: 全quality_requirementsの成果物・コマンド/状態・レビュー・対象版の証拠が必要。Unknown/Not Testedを残しただけでは実装完了にしない。
