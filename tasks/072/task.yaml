problem:
  - Completing individual tasks does not establish every original product requirement or integrated final-source compatibility.
  - Historical evidence and valid partial measurements must not be relabelled to claim v0.4 completion.
acceptance:
  - 'X01: For identical selected facts/configuration with new options absent, verify existing CLI/exit precedence, six reports, JSON/SARIF/CBOM/CycloneDX, Inventory/assessment v1, Risk/Severity/confidence/0.45, IDs and references; separately explain any explicitly approved correction.'
  - 'X05: Every R1-R5 and X row has implementation, selected scope, executed applicable evidence, exact source/input/context/model/time bindings and required review decisions; task counts or artifact lists do not substitute.'
  - Verify final-source applicability of upstream checks, including optional configurations and required rendered/browser evidence; rerun affected checks when reuse is invalid rather than repeating all measurements automatically.
  - Preserve historical truths, failures and support limits; do not average scores, defer mandatory work, narrow criteria or treat an Unknown display as implementation completion.
  - Record a justified all-row completion decision only when mandatory work is fulfilled; otherwise keep work unfinished with concrete dependencies and actions. Product acceptance, D7 score adoption, support and publication remain separate.
deliverables:
  - tasks/072/TASK-072-RESULTS.md
  - tasks/072/evidence/
  - Final all-row implementation/evidence reconciliation, integrated compatibility results, reused-evidence applicability and separate completion/acceptance/release dispositions.
implementation_steps:
  - Pin the final source and collect task-065 through task-071 decisions, outputs and exact evidence bindings.
  - Reconcile every detailed requirement against the canonical primary-owner mapping and original acceptance text without replacing historical labels.
  - Validate integrated old/new CLI and output workflows using applicable existing compatibility checks and the selected optional configurations.
  - Resolve in-scope discrepancies with the responsible task and existing reviewers under the lifecycle rules; do not automatically create unrelated tasks or rewrite completed history.
  - Record final-source checks, review applicability, remaining product limits and the independent completion/product/release conclusions.
testing_requirements:
  - Verify all 30 requirement rows and all applicable A01-A18 cases, including default legacy behavior and selected-input failure boundaries.
  - Check exact source/data/model/policy/context/time, schema/reference, semantic output and no-network/privacy bindings across the integrated workflow.
  - Apply docs/agent/VERIFICATION.md, required optional configurations, docs/agent/REPORTS.md and the required review stages for any executable change; upstream reviews do not automatically cover later edits.
  - Keep failed, skipped, unavailable and reused results distinct; a valid adverse measurement does not excuse missing required implementation or verification.
out_of_scope:
  - Release/publication, support expansion, unrelated v0.3 remediation, rewriting historical acceptance and automatic follow-up task creation.
risks:
  - Done task states or a passing aggregator may conceal an unmet original requirement or stale evidence.
  - Integration edits may invalidate earlier checks/reviews or silently expand support and scoring claims.
approval_boundary:
  - Execution requires later selection and all prerequisites; unresolved original mandatory work prevents v0.4 completion.
  - Criterion changes, storage/rule/crypto boundaries, new hard quality gates, D7 adoption and publication retain their separate human decisions.
  - Review budgets remain per authorized request; task registration or splitting does not grant new reviewer identities.
