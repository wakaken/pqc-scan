problem:
- The required new-language outcomes are not delivered by current seven-language source routing, limited normalization
  or dependency formats. Existing v0.4 correctness/privacy/contracts must remain intact.
acceptance:
- 'Implement the C/C++ scope of L03-L07: OpenSSL low-level/classical APIs, explicit EVP key/context selection
  and KEM/signature operations, provider/property/TLS-group references, liboqs C and official C++ receiver operations.'
- Bind generic EVP/receiver operations only to unambiguous bounded local selection; dynamic contexts, pointers,
  macros, templates and cross-file includes do not supply invented algorithms or active branches.
- Use 077 routing and combined header budget; retain conflicting parse/binding uncertainty, repeated same-line
  operations and explicit incomplete status on hostile/deep/malformed input.
- Preserve exact standardized/draft/experimental/hybrid names. Provider load, includes, TLS version and cipher
  suites are not algorithm activation or negotiation. X-Wing and TLS hybrid names are not interchangeable.
- Preserve existing lexical OpenSSL rule IDs/findings unless an incompatible correction is separately approved;
  document overlap with new observations, attach current quality metadata, and ship tests and paired documentation.
deliverables:
- tasks/080/TASK-080-RESULTS.md
- tasks/080/evidence/
- The scoped behavior or feasibility deliverable, meaningful verification, affected documentation and applicable
  review evidence; no completion follows from registration.
implementation_steps:
- Write detector-level positive/negative fixtures for every initial OpenSSL/OQS C/C++ family and legacy overlap.
- Implement bounded local context/receiver selection and source-specific rules without preprocessing or compilation
  of scanned inputs.
- Exercise header/conditional/dynamic/macro/unknown-key and precise span/identity controls.
- Update current quality/rule references and paired user scope with applicable old/new regression evidence.
testing_requirements:
- Apply docs/agent/VERIFICATION.md for all affected categories, including targeted behavior, workspace tests,
  formatting/diff inspection, Clippy, applicable builds/features and package/dependency provenance checks; record
  actual commands/exits and final-source applicability.
- For executable changes, obtain implementation review after initial checks and combined-diff inspection, then
  test review after required tests. Reuse the same two stage reviewers within one authorized request; splitting
  tasks or PRs grants no additional identities.
- New source/rule/manifest coverage needs meaningful positive, negative, malformed/unknown, resource/position/identity
  and private-data controls. Browser acceptance uses docs/agent/REPORTS.md where presentation/interaction is
  affected.
- Cover C and C++ syntax/routes independently, liboqs-cpp qualified use, literal EVP contexts, provider overrides,
  groups, includes-only cases and unknown operation key types.
- Check old OpenSSL lexical IDs, AST/regex coexistence, custom packs, duplicate same-line spans, malformed headers
  and shared resource caps.
out_of_scope:
- Executing preprocessors/compilers/build files, arbitrary include/pointer/template resolution, universal runtime
  support, full secondary-library API analysis and 081 dependency parsing.
risks:
- An API/library name, dependency or syntactic reference may be promoted beyond its assurance, or historical
  evidence may be mistaken for coverage of new final-source behavior.
approval_boundary:
- Definition and registration only under the 2026-11-24 steering; this task is not selected for execution. Dependencies
  must complete and later explicit task selection is required.
- Storage-format changes, high-risk architecture, unclear cryptographic logic and potentially incompatible rules
  require the applicable AGENTS human decision; routine choices within agreed scope do not create a new approval
  gate.
- No extra agents, release/push/publication, outreach, fees or unagreed scope/criteria changes. Review budget
  remains per authorized request.
