problem:
- The required new-language outcomes are not delivered by current seven-language source routing, limited normalization
  or dependency formats. Existing v0.4 correctness/privacy/contracts must remain intact.
acceptance:
- Reconcile all PHP/C#/C/C++ scoped L03-L07 evidence from 078-080 and the complete mandatory API matrix; an
  integration smoke test cannot cover a missing component family.
- New exact primitive/parameter facts reach inventory, SavedEvidence and existing technical judgments with
  safe original references; dependencies/imports/provider or unknown API facts stay reference-only or unknown
  as appropriate.
- Use existing v0.4 generation, context-template, input-support and local-web helpers; L24 is mandatory. Reuse
  immutable saved input and exact target hashes, scope, freshness and purpose; invalidate replaced input and
  reject stale context without positional remapping.
- Unknown support cannot become ready, a false relevant prerequisite remains blocked, scope/claim overrides
  do not leak across systems or roles, and syntactic references never become executed or negotiated facts.
- CLI/local-web scanning and context/assessment agree for identical input/context/version/time; saved assessment
  performs no scan/network/probe operation. Bilingual JSON/Markdown/HTML preserve the same decisions and useful
  locations/guidance.
- Ship real integration/privacy/failure tests, affected paired guides and actual keyboard/offline browser observations
  through a dedicated loopback generated-report directory.
deliverables:
- tasks/082/TASK-082-RESULTS.md
- tasks/082/evidence/
- The scoped behavior or feasibility deliverable, meaningful verification, affected documentation and applicable
  review evidence; no completion follows from registration.
implementation_steps:
- Pin the final committed v0.4 APIs and collect source-bound component coverage before integration.
- Write failing scan/inventory/context/evaluation/report cases for all language families, missing facts, sparse/false
  claims and invalid replacement bindings.
- Implement minimal adapter/guidance/presentation connections without duplicating schemas or policy engines.
- Exercise real CLI/template/serve/assessment paths, bilingual browser outputs and no-network/safe-output/secret
  controls; reconcile every cross-language clause.
testing_requirements:
- Apply docs/agent/VERIFICATION.md for all affected categories, including targeted behavior, workspace tests,
  formatting/diff inspection, Clippy, applicable builds/features and package/dependency provenance checks;
  record actual commands/exits and final-source applicability.
- For executable changes, obtain implementation review after initial checks and combined-diff inspection, then
  test review after required tests. Reuse the same two stage reviewers within one authorized request; splitting
  tasks or PRs grants no additional identities.
- New source/rule/manifest coverage needs meaningful positive, negative, malformed/unknown, resource/position/identity
  and private-data controls. Browser acceptance uses docs/agent/REPORTS.md where presentation/interaction is
  affected.
- Use actual saved inventories with exact input/context hashes and target IDs; test same-algorithm different-system
  scope, missing/false/stale/conflicting claims and purpose-specific prerequisites.
- Check old saved-input judgments, unknown catalog constructions, legacy reports/defaults and identical CLI/local-UI
  semantics.
- Use docs/agent/REPORTS.md browser workflow, actual captures and keyboard/offline/error checks; DOM/unit logs
  alone cannot satisfy browser acceptance.
out_of_scope:
- New policy/catalog meaning without a specification, new storage schemas, probes, separate web apps, fabricated
  capability/business claims and automatic cross-scan context rebinding.
risks:
- An API/library name, dependency or syntactic reference may be promoted beyond its assurance, or historical
  evidence may be mistaken for coverage of new final-source behavior.
approval_boundary:
- Definition and registration only under the 2026-11-24 steering; this task is not selected for execution.
  Dependencies must complete and later explicit task selection is required.
- Storage-format changes, high-risk architecture, unclear cryptographic logic and potentially incompatible
  rules require the applicable AGENTS human decision; routine choices within agreed scope do not create a new
  approval gate.
- No extra agents, release/push/publication, outreach, fees or unagreed scope/criteria changes. Review budget
  remains per authorized request.
