id: '052'
title: OpenSSFとGitHub設定・保守手順を根拠付きで評価する
type: improvement
priority: high
status: pending
owner: Planner Agent
phase: '5'
description: 実設定・実行実績と推奨変更を分け、権限不足や未運用を隠さない。
quality_alias: QAM-09のOSS運用部分
plan_reference: docs/quality/QUALITY-ROADMAP.md
requirements_reference: docs/quality/QUALITY-REQUIREMENTS.md
quality_requirements:
- Q6-05
- Q6-06
- Q6-07
- Q6-08
- Q6-09
depends_on:
- '041'
target_components:
- .github/workflows/
existing_assets:
- E41
- EC
- EG
- EU
problem:
- 貢献・変更・保守手順の実態確認
- 管理設定とeffective権限の確認
- 受付・対応・修正版案内の手順確認
- 固定工具での実測
- 根拠付き自己評価
acceptance:
- 'Q6-05: Best Practicesの各項目に根拠と担当を示し、文書の存在と実行実績を区別'
- 'Q6-06: 取得できた設定と推奨変更を分け、権限不足はUnknown。設定変更は別承認'
- 'Q6-07: 公開窓口/対応範囲/担当/連絡経路を確認し、未運用部分を明記'
- 'Q6-08: commit/工具版/取得日と各check・取得不能理由を保存し、検出精度とは別表示'
- 'Q6-09: 全適用項目を根拠と照合し、申請・取得の有無を区別。badge申請は別指示'
deliverables:
- target/quality-task-052/best-practices.md
- target/quality-task-052/github-controls.json
- target/quality-task-052/process-review.md
- target/quality-task-052/scorecard.json
- target/quality-task-052/security-process.md
implementation_steps:
- 着手前に対象HEAD・既存証拠・対応範囲・費用を再確認する。
- 対応する要求の不足だけを既存の仕組みに追加する。計測結果・失敗・未実行理由を保存する。
- 実装変更にはAGENTS.mdの実装レビューと試験妥当性レビューを適用し、必要な検証後にEvaluatorが判定する。
testing_requirements:
- 受入条件ごとの正例・負例・境界例を既存試験に結び付け、手計算または独立した事実を正解とする。
- ソース・入力・工具・規則・コマンドと終了状態をhash付きで保存し、過去の記録を上書きしない。
risks:
- API権限不足を設定無効と判断する、または自己申告を運用実績と取り違えるおそれがある。
- 既存証拠の再利用だけで新しい対象範囲を検証済みと誤認するおそれがある。
- 未実施や環境差を合格・製品退行と取り違えない。必要な追加工具は費用・版・権限・隔離を評価してから選ぶ。
approval_boundary:
- 検出規則・暗号判断・公開Schema・数値ハードゲート・正式サポートの意味変更は影響分析と承認後に行う。
- リモート設定変更・公開・merge・tag・実release署名は別の明示許可を要する。
planning_record:
  date: '2026-11-11'
  scope: 今回の依頼は計画とタスク整理のみ。実装・工具導入・製品測定は未着手。
  evidence_scope: 参照先は既存実装と過去の限定された証拠。新タスクの実行成功を意味しない。
  completion_evidence: 全quality_requirementsの成果物・コマンド/状態・レビュー・対象版の証拠が必要。Unknown/Not Testedを残しただけでは実装完了にしない。
