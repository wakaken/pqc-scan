id: "015"
title: Refresh PQC inventory and guidance across seven languages
type: feature
priority: high
status: done
owner: Evaluator Agent
description: >
  User-requested expansion beyond the task 014 restart pilot. Preserve existing
  edits and report schemas. Implement eight reviewed candidates sequentially:
  guidance, API inventory, explicit TLS restrictions, dependency inventory rules,
  draft algorithm identification, certificate OIDs, JWT guidance, and examples.
implementation_steps:
  - Add positive and negative detector tests before implementation.
  - Add scoped PQC API rules, explicit TLS restriction rules, dependency and draft rules.
  - Match certificate signature and public key OIDs independently without changing report fields.
  - Update runtime and JWT recommendations with verified official references.
  - Add seven-language static fixtures and synchronize both READMEs and rule reference.
testing_requirements:
  - cargo build --workspace
  - cargo fmt --all --check
  - cargo test --workspace
  - cargo clippy --workspace --all-targets -- -D warnings
  - All-format example scan and old-rule regression comparison
security_considerations:
  - No cryptographic operations or secret material in fixtures.
  - API and dependency presence does not prove runtime support or negotiation.
  - Preserve existing rule IDs, output field names, and private-key masking.
acceptance:
  - All eight candidates have implementation and test or fixture evidence.
  - Certificate OIDs cannot be spoofed by filenames.
  - Negative examples and existing tests pass.
implementation_evidence:
  guidance: Seven-runtime capability guidance with official references; version/provider caveats retained
  api_inventory: Seven language rules, informational primitive-level classification only
  tls_settings: Explicit Go disable override and recognized Java/Ruby classical-only lists
  dependencies: Exact package and ecosystem matches; versions preserved in inventory, no enabled-state claim
  draft_algorithms: Kyber/Dilithium draft names distinguished from final ML-KEM
  certificates: ML-DSA and SLH-DSA signature/public-key OIDs matched independently
  jwt: JOSE identifiers, key encoding, libraries and verifier rollout required before signature changes
  examples: Seven checked-in static source fragments, negative case and TLS override fixture
