testing_requirements:
- 受入条件ごとの正例・負例・境界例を既存試験に結び付け、手計算または独立した事実を正解とする。
- ソース・入力・工具・規則・コマンドと終了状態をhash付きで保存し、過去の記録を上書きしない。
risks:
- 入力探索による資源枯渇やcrash成果物への秘密混入、fuzz専用設定による検証の弱体化を防ぐ必要がある。
- 既存証拠の再利用だけで新しい対象範囲を検証済みと誤認するおそれがある。
- 未実施や環境差を合格・製品退行と取り違えない。必要な追加工具は費用・版・権限・隔離を評価してから選ぶ。
approval_boundary:
- 検出規則・暗号判断・公開Schema・数値ハードゲート・正式サポートの意味変更は影響分析と承認後に行う。
- リモート設定変更・公開・merge・tag・実release署名は別の明示許可を要する。
