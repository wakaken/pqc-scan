id: '071'
title: Evaluate migration decision usefulness and numerical scoring validity
type: improvement
priority: high
status: blocked
owner: Main agent
phase: '7'
description: >
  Execute the evaluation protocol frozen in task 066 using the actual decision
  workflow and human reports. Extend existing PQS-QAM comparison/aggregation and
  reach a supported scoring disposition without inventing independent evidence.
plan_reference: docs/roadmap/v0.4/ROADMAP.md
requirements_reference: docs/roadmap/v0.4/REQUIREMENTS.md
quality_requirements:
  - R5-01
  - R5-02
  - R5-03
  - R5-04
  - R5-05
depends_on:
  - '066'
  - '069'
  - '070'
target_components:
  - tests/quality/
  - docs/quality/
  - docs/quality/EVIDENCE-CATALOG.json
existing_assets:
  - E-QAM
  - E-JUDGMENT
  - E-COMPAT
problem:
  - Decision-table conformance does not establish practitioner usefulness or a numerical model's benefit.
  - Valid independent cases, participants and declared policy authority are dependencies, not assumed resources.
acceptance:
  - 'R5-01: Compare the explicit table/tree baseline and at least one comparable alternative on common cases/facts/policy; document ordinal/numerical/MCDA screening and reject unjustified weights rather than fabricating them.'
  - 'R5-02: Separate technical facts, implementation conformance and practitioner usefulness; secure D6 resources, retain disagreements and adjudication, disclose authorship/source exposure and keep tuning/holdout data separate.'
  - 'R5-03: Execute the frozen measures with stated denominators for explanation/action consistency, harmful under-prioritization, missingness, sensitivity, ordering, effort and rater disagreement; separate same-version reproducibility from policy-change effects.'
  - 'R5-04: Record supported adoption, supported non-adoption or insufficient evidence with scale/normalization/weight/correlation/missingness/uncertainty analysis; missing mandatory evaluation remains unfinished and unsupported superiority/inferiority claims are prohibited.'
  - 'R5-05: Extend existing source-bound comparison/aggregation without rewriting historical truth, thresholds or measurements; no parallel quality platform or unapproved numerical product score is introduced.'
deliverables:
  - tasks/071/TASK-071-RESULTS.md
  - tasks/071/evidence/
  - Frozen study/provenance receipts, raw comparisons, practitioner/adjudication records, per-dimension measures, costs/limits and a justified scoring disposition in the existing evidence pipeline.
implementation_steps:
  - Verify the task-066 protocol freeze, selected source/model/context/time and confirmed D6 participants/resources before observations.
  - Prepare independent technical/decision cases with disclosed roles and exposure; do not reuse tuned data as holdout or claim AI review as human expert validation.
  - Screen candidates and run the bounded common-case comparison and practitioner evaluation without implementing multiple product engines.
  - Extend existing aggregation only as needed, retaining negative controls, disagreement, failures, missing denominators and source applicability.
  - Report scoring disposition and required follow-up decisions; finish all required validation and reviews before claiming the evaluation complete.
testing_requirements:
  - Include paired urgent-but-unready, unknown-context, same-algorithm/different-system and partial-inspection cases under the predeclared measures.
  - Verify raw-to-summary consistency and reject missing/duplicate/extra observations, stale sources and invalid denominators without changing original truth.
  - Exercise affected existing evaluator tests and required checks; any reusable executable evaluator change receives both implementation and test review under AGENTS.md.
  - Preserve task-056 authorship limits, old failures and numerical-gate semantics; an unavailable required study input keeps affected work unfinished.
out_of_scope:
  - Automatically adopting a numerical score, replacing PQS-QAM, manufacturing participants, new unrelated studies and automatic task creation from findings.
risks:
  - Table agreement, correlated synthetic cases or source-exposed authorship may be misrepresented as independent operational validity.
  - Withholding a score may be used to hide an unexecuted mandatory comparison or unavailable practitioner truth.
approval_boundary:
  - Execution requires later selection and completed prerequisites; confirm D6 authority, resources and assessment criteria before results are seen.
  - A supported adoption proposal still requires the separate D7 formula/model/version decision and compatibility plan before product integration.
  - Recruiting participants or sending external messages requires the applicable explicit authorization; this definition grants neither.
