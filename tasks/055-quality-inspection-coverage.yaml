id: '055'
title: 列挙・検出器適用・処理完了を分けて測定する
type: improvement
priority: high
status: pending
owner: Planner Agent
phase: '2'
description: 未知母数を保持し、検出器別の適用/未報告/部分/失敗を既存診断から集約する。
quality_alias: '追加: Q2専用'
plan_reference: docs/quality/QUALITY-ROADMAP.md
requirements_reference: docs/quality/QUALITY-REQUIREMENTS.md
quality_requirements:
- Q2-01
- Q2-02
- Q2-03
- Q2-04
- Q2-05
- Q2-06
- Q2-07
- Q2-08
depends_on:
- '041'
target_components:
- crates/pqc_scan_core/src/pipeline.rs
existing_assets:
- E18
- E19
- E41
problem:
- 評価範囲拡大時の集計と試験
- 全形式・版の対応表と実結果の対応
- 制限別件数・停止理由の集約
- 明示除外と列挙できない対象の分離
- 既知の全入力集合による列挙漏れの試験
- 開発用の検出器別集約が未実装
- 三つの測定を分けた報告
- 故障注入と報告の対応確認
acceptance:
- 'Q2-01: selected/read/terminalの等式を満たし、重複計上と失敗の成功扱いを拒否'
- 'Q2-02: 未対応の理由と対象を記録し、未対応入力の所見0を安全判定にしない'
- 'Q2-03: 境界値と超過例で部分結果を保持し、打ち切りを通常完了と区別'
- 'Q2-04: 設定した除外と実際に列挙した除外を区別して再現試験で確認'
- 'Q2-05: 管理された入力一覧で列挙漏れを検証し、任意リポジトリの未知母数を0に置換しない'
- 'Q2-06: 検出器×入力形式ごとの適用・非適用・未報告・失敗を集計し、想定値と照合'
- 'Q2-07: 計算可能な率だけを分母付きで示し、未知の列挙総数で率を作らない'
- 'Q2-08: 読み取り不能・不正構文・一検出器失敗でも他の結果と診断を保持'
deliverables:
- target/quality-task-055/coverage-denominators.json
- target/quality-task-055/detector-coverage.json
- target/quality-task-055/enumeration-review.md
- target/quality-task-055/exclusions.json
- target/quality-task-055/failure-retention.json
- target/quality-task-055/file-outcomes.json
- target/quality-task-055/format-coverage.json
- target/quality-task-055/limit-outcomes.json
implementation_steps:
- 着手前に対象HEAD・既存証拠・対応範囲・費用を再確認する。
- 対応する要求の不足だけを既存の仕組みに追加する。計測結果・失敗・未実行理由を保存する。
- 実装変更にはAGENTS.mdの実装レビューと試験妥当性レビューを適用し、必要な検証後にEvaluatorが判定する。
testing_requirements:
- 受入条件ごとの正例・負例・境界例を既存試験に結び付け、手計算または独立した事実を正解とする。
- ソース・入力・工具・規則・コマンドと終了状態をhash付きで保存し、過去の記録を上書きしない。
risks:
- 未列挙母数を0とする、適用不能を成功とする、fileと検出器の状態を二重計上するおそれがある。
- 既存証拠の再利用だけで新しい対象範囲を検証済みと誤認するおそれがある。
- 未実施や環境差を合格・製品退行と取り違えない。必要な追加工具は費用・版・権限・隔離を評価してから選ぶ。
approval_boundary:
- 検出規則・暗号判断・公開Schema・数値ハードゲート・正式サポートの意味変更は影響分析と承認後に行う。
- リモート設定変更・公開・merge・tag・実release署名は別の明示許可を要する。
planning_record:
  date: '2026-11-11'
  scope: 今回の依頼は計画とタスク整理のみ。実装・工具導入・製品測定は未着手。
  evidence_scope: 参照先は既存実装と過去の限定された証拠。新タスクの実行成功を意味しない。
  completion_evidence: 全quality_requirementsの成果物・コマンド/状態・レビュー・対象版の証拠が必要。Unknown/Not Testedを残しただけでは実装完了にしない。
