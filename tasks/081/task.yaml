problem:
- The required new-language outcomes are not delivered by current seven-language source routing, limited normalization
  or dependency formats. Existing v0.4 correctness/privacy/contracts must remain intact.
acceptance:
- Implement every dependency-input row from ROADMAP.md section 4.2, including Composer manifests/locks/platform
  emulation; NuGet/project/central/legacy/SDK inputs; packages.lock versions 1/2; vcpkg declarations/configuration;
  Conan text/0.5 locks; and bounded literal CMake references.
- Preserve declared, reported, locked, conditional, development/platform, Git/path/custom and SDK facts through
  the existing six fields; concrete registry resolution/purls require eligible source evidence, never installation
  or inferred graph.
- NuGet identifiers compare case-insensitively without merging distinct source assertions; Composer vendor/package
  names use narrow validated namespace handling. Do not invent a registry purl for CMake/Conan/vcpkg sources.
- Nearest selected in-root literal central-package context works; dynamic properties, arbitrary imports, exclusion/symlink/out-of-root
  inputs and unselected files are unresolved or rejected with bounded safe status.
- Guidance separates PHP extension/native library, .NET target/package/OS/provider and C/C++ backend/build prerequisites,
  plus distinct OQS wrapper maintenance identities. Missing versions and provider/peer/protocol support remain
  unknown.
deliverables:
- tasks/081/TASK-081-RESULTS.md
- tasks/081/evidence/
- The scoped behavior or feasibility deliverable, meaningful verification, affected documentation and applicable
  review evidence; no completion follows from registration.
implementation_steps:
- Write failing valid-empty/supported/unsupported/malformed/duplicate and provenance tests for every format
  row.
- Implement bounded parsers and explicit local context using current status/resource/identity contracts, without
  invoking package managers.
- Add narrow ecosystem validation/projection only where representable and retain unresolved source records safely.
- Implement evidence-bound language/library guidance, affected rule quality updates, paired docs and parser/context/guidance
  regression tests.
testing_requirements:
- Apply docs/agent/VERIFICATION.md for all affected categories, including targeted behavior, workspace tests,
  formatting/diff inspection, Clippy, applicable builds/features and package/dependency provenance checks; record
  actual commands/exits and final-source applicability.
- For executable changes, obtain implementation review after initial checks and combined-diff inspection, then
  test review after required tests. Reuse the same two stage reviewers within one authorized request; splitting
  tasks or PRs grants no additional identities.
- New source/rule/manifest coverage needs meaningful positive, negative, malformed/unknown, resource/position/identity
  and private-data controls. Browser acceptance uses docs/agent/REPORTS.md where presentation/interaction is
  affected.
- Cover exact schema versions, custom sources, duplicate/malformed siblings, XML entities, central-package imports/conditions/multitargeting
  and JSON depth/record/byte limits.
- Check safe identifiers/versions/purls, no secret URL payloads, source-local assertion identity and no manifest-lock
  graph joining.
- Check explicit backend/version gaps, deprecated official versus independent wrappers, no AES-to-PQC blanket
  replacement and no dependency-to-ready promotion.
out_of_scope:
- Project/package/build execution, package installation, network registry queries, arbitrary MSBuild/CMake/Python
  evaluation, dependency-graph reconstruction and unapproved versioned-storage changes.
risks:
- An API/library name, dependency or syntactic reference may be promoted beyond its assurance, or historical
  evidence may be mistaken for coverage of new final-source behavior.
approval_boundary:
- Definition and registration only under the 2026-11-24 steering; this task is not selected for execution. Dependencies
  must complete and later explicit task selection is required.
- Storage-format changes, high-risk architecture, unclear cryptographic logic and potentially incompatible rules
  require the applicable AGENTS human decision; routine choices within agreed scope do not create a new approval
  gate.
- No extra agents, release/push/publication, outreach, fees or unagreed scope/criteria changes. Review budget
  remains per authorized request.
