problem:
- 測定対象拡大とOSごとの単位・取得範囲
- 実製品相当のサイズ・構成
- 異なる規模・並列度・構成での測定
- cache条件と実行日差の測定
- 新入力・feature・環境にまたがる再現
- 並列度・環境・全出力形式での確認
- tool/provider/OS/arch差の比較条件
- 失敗時の資源測定
- 測定拡大後の比較と調査手順
acceptance:
- 'Q5-01: 時刻・CPU・RSSの単位/対象プロセスを明示し、取得不能値をnullで保持'
- 'Q5-02: files/bytesを実入力と照合し、起動/出力時間込みのthroughputと分母を示す'
- 'Q5-03: 認可済み/再配布可能な入力を固定し、増加傾向とばらつきを記録'
- 'Q5-04: 本当のcoldと初回を区別し、sample数・分布・環境差を開示'
- 'Q5-05: 除去する変動項目を限定し、事実・ID・重複の変化を検出'
- 'Q5-06: 意味が同じでも順序差を別報告し、安定性を主張する条件を定める'
- 'Q5-07: 比較できる条件とできない条件を識別し、環境変化を製品退行と混同しない'
- 'Q5-08: 失敗を高速成功に数えず、原因・使用資源・保持結果を併記'
- 'Q5-09: 既存条件を保ち、2x超過は調査として残し、改定には測定変動と承認を要する'
