problem:
- The required new-language outcomes are not delivered by current seven-language source routing, limited normalization
  or dependency formats. Existing v0.4 correctness/privacy/contracts must remain intact.
acceptance:
- Implement the C# scope of L03-L07 for standard classical/PQC API families, concrete providers and Bouncy Castle
  rows in ROADMAP.md, with exact parameter and bounded receiver operations.
- Resolve file-local using/global-using/qualified aliases and ordinary/file-scoped namespaces with local type/variable
  shadowing and reassignment. Cross-file globals, reflection, generators, assemblies and Razor remain outside
  the source subset.
- Discover standard PQC classes without assuming AsymmetricAlgorithm inheritance; do not classify unrelated
  RSA/MLDsa namesakes or imports as successful crypto operations.
- CompositeMLKem/CompositeMLDsa/HPKE remain explicit construction-unresolved references where the finite catalog
  cannot judge them. Standard .NET, BC TLS, obsolete official OQS and independent community identities remain
  distinct.
- Ship scoped rules, current source-bound classification/quality controls, C# positive/negative tests and paired
  documentation; OS/provider/version prerequisites are not inferred from target framework or dependency presence.
  Full cross-language clauses close in 082.
deliverables:
- tasks/079/TASK-079-RESULTS.md
- tasks/079/evidence/
- The scoped behavior or feasibility deliverable, meaningful verification, affected documentation and applicable
  review evidence; no completion follows from registration.
implementation_steps:
- Write failing literal type/alias/receiver/parameter cases and negative namesake/dynamic/conditional controls.
- Implement minimal C# grammar-specific name and receiver facts plus required rules.
- Verify safe identity/parameter capture, uncertainty, positions, duplicate handling and modified custom-rule
  fallback.
- Update current rule metadata/reference and paired scope documentation with applicable checks and source bindings.
testing_requirements:
- Apply docs/agent/VERIFICATION.md for all affected categories, including targeted behavior, workspace tests,
  formatting/diff inspection, Clippy, applicable builds/features and package/dependency provenance checks; record
  actual commands/exits and final-source applicability.
- For executable changes, obtain implementation review after initial checks and combined-diff inspection, then
  test review after required tests. Reuse the same two stage reviewers within one authorized request; splitting
  tasks or PRs grants no additional identities.
- New source/rule/manifest coverage needs meaningful positive, negative, malformed/unknown, resource/position/identity
  and private-data controls. Browser acceptance uses docs/agent/REPORTS.md where presentation/interaction is
  affected.
- Cover required .NET/BC APIs, qualified aliases, rebound/local namesakes, file-scoped namespaces, conditional
  references, missing parameter sets and unresolved composite/HPKE KEM selection.
- Verify import/reference versus operation strength, unchanged native-platform uncertainty and no readiness
  promotion or private-data leakage.
out_of_scope:
- Running dotnet/MSBuild/NuGet or generators, whole-project semantic analysis, Razor support, universal JOSE/TLS/PQC
  backend claims and 081 dependency parser implementation.
risks:
- An API/library name, dependency or syntactic reference may be promoted beyond its assurance, or historical
  evidence may be mistaken for coverage of new final-source behavior.
approval_boundary:
- Definition and registration only under the 2026-11-24 steering; this task is not selected for execution. Dependencies
  must complete and later explicit task selection is required.
- Storage-format changes, high-risk architecture, unclear cryptographic logic and potentially incompatible rules
  require the applicable AGENTS human decision; routine choices within agreed scope do not create a new approval
  gate.
- No extra agents, release/push/publication, outreach, fees or unagreed scope/criteria changes. Review budget
  remains per authorized request.
