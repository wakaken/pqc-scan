id: '052'
title: OpenSSFとGitHub設定・保守手順を根拠付きで評価する
type: improvement
priority: high
status: blocked
owner: Main agent (Evaluator)
phase: '5'
description: 実設定・実行実績と推奨変更を分け、権限不足や未運用を隠さない。
quality_alias: QAM-09のOSS運用部分
plan_reference: docs/roadmap/v0.3/ROADMAP.md
requirements_reference: docs/roadmap/v0.3/REQUIREMENTS.md
