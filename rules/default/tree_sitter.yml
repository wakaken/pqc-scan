- id: TS_TLS_RSA_CIPHER_LITERAL
  kind: tree_sitter
  category: TLS
  severity: high
  risk: quantum-vulnerable
  confidence: 0.66
  migration_hint: "Identify the suite role: RSA_WITH uses static RSA key exchange; ECDHE_RSA and DHE_RSA use RSA authentication. Review hybrid key agreement and PQC authentication separately."
  pattern: "(?i)\\bTLS_(?:[A-Z0-9]+_)*RSA_WITH_[A-Z0-9_]+\\b"
  scope: "java,javascript,typescript,python,go,rust,ruby"
  description: RSA-family TLS cipher suite literals detected in AST nodes.

