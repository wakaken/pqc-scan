  severity: high
  risk: non-quantum-risk
  confidence: 0.75
  migration_hint: Prefer TLS 1.3; restrict to TLS 1.3 when all peers support it. Retain securely configured TLS 1.2 only for a documented interoperability need. Disable TLS 1.0 and 1.1.
  pattern: "(?i)(?:^|[^A-Za-z0-9_])TLSv1(?:[._][01])?(?:$|[^A-Za-z0-9_.])"
  scope: "java,javascript,typescript,python,go,rust,ruby"
  description: Legacy TLS version literals detected in AST nodes.

