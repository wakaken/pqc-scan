- id: C_FAMILY_CRYPTO_API
  kind: tree_sitter
  category: CryptoAPI
  severity: medium
  risk: quantum-uncertain
  confidence: 0.80
  migration_hint: Verify the primitive, purpose, linked provider and build configuration. A source request or provider/group setting does not establish runtime capability or negotiation.
  pattern: '\b(?:RSA_[A-Za-z_]+|DSA_[A-Za-z_]+|DH_[A-Za-z_]+|EC_KEY_[A-Za-z_]+|ECDSA_[A-Za-z_]+|ECDH_[A-Za-z_]+|EVP_[A-Za-z_]+|OSSL_PROVIDER_load|SSL(?:_CTX)?_set1_groups_list|OQS_(?:KEM|SIG)_new)\b'
  scope: c,cpp
  description: C/C++ cryptographic API or configuration reference; effective primitive and runtime use require verification.

- id: C_FAMILY_PQC_API
  kind: tree_sitter
  category: PQC
  severity: info
  risk: quantum-uncertain
  confidence: 0.80
  migration_hint: Verify the exact standard or draft parameter set, linked OQS/OpenSSL version and build flags. Requested algorithms are not proof of enabled or active protection.
  pattern: '\b(?:OQS_(?:KEM|SIG)_[A-Za-z_]+|oqs::(?:KeyEncapsulation|Signature)|EVP_PKEY_[A-Za-z_]+)\b'
  scope: c,cpp
  description: C/C++ PQC source reference; requested parameter sets do not prove enabled mechanisms or active protection.

- id: C_FAMILY_TLS_REFERENCE
  kind: tree_sitter
  category: CryptoAPI
  severity: info
  risk: quantum-uncertain
  confidence: 0.60
  migration_hint: Check included libraries, exact TLS groups and provider configuration separately from deployment and negotiated connections. Includes alone do not prove linking or enabled algorithms.
  pattern: '(?:openssl/(?:evp|rsa|dsa|dh|ec|ssl|provider)\.h|oqs/oqs\.h|oqs_cpp\.hpp)'
  scope: c,cpp
  description: C/C++ cryptographic include or TLS library reference; linking and negotiation remain unverified.
