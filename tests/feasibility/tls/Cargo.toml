[workspace]

[package]
name = "pqc-scan-tls-feasibility"
version = "0.0.0"
edition = "2021"
rust-version = "1.93.1"
publish = false

[features]
default = ["tls12"]
tls12 = ["rustls/tls12"]

[dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["std", "aws_lc_rs"] }
aws-lc-rs = { version = "=1.18.0", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
rcgen = { version = "=0.14.7", default-features = false, features = ["aws_lc_rs"] }
pqc_scan_core = { path = "../../../crates/pqc_scan_core", features = ["probe-transport"] }
serde_json = "=1.0.149"
