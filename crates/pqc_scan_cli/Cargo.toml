[package]
name = "pqc_scan_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
probe-transport = ["pqc_scan_core/probe-transport"]
probe-tls = ["probe-transport", "dep:pqc_scan_probe_tls", "pqc_scan_probe_tls/runtime", "dep:ctrlc"]

[[bin]]
name = "pqc-scan"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
serde.workspace = true
ctrlc = { version = "=3.5.1", optional = true }
pqc_scan_probe_tls = { path = "../pqc_scan_probe_tls", optional = true }
pqc_scan_core = { path = "../pqc_scan_core" }
pqc_scan_rules = { path = "../pqc_scan_rules" }
pqc_scan_detectors = { path = "../pqc_scan_detectors" }
pqc_scan_report = { path = "../pqc_scan_report" }

[dev-dependencies]
libc = "0.2"
serde_json.workspace = true
jsonschema = { version = "=0.29.1", default-features = false }
