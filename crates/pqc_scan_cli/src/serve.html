<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>pqc-scan · Local scanner</title><style>
:root{color-scheme:light;--bg:#f6f8fa;--card:white;--text:#1f2328;--line:#d1d9e0;--muted:#59636e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui}main{max-width:1000px;margin:auto;padding:32px 20px}header{display:flex;justify-content:space-between;gap:24px;align-items:start}h1{font-size:28px;margin:4px 0}h2{font-size:18px;margin:0 0 16px}p{margin:8px 0 16px}small,.muted{color:var(--muted)}section{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:24px 0;padding:24px}button,select{font:inherit;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--text);padding:8px 12px;cursor:pointer;min-height:40px}button:hover{background:#eef1f4}button:disabled{opacity:.5;cursor:default}.primary{background:#1f883d;color:white;border-color:#1f883d}.primary:hover{background:#1a7f37}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.path{font-family:ui-monospace,monospace;overflow-wrap:anywhere;min-width:0}.folder{display:flex;width:100%;text-align:left;gap:12px;align-items:center;border:0;border-bottom:1px solid var(--line);border-radius:0}.folder span:first-child{overflow-wrap:anywhere}.folder span:last-child{margin-left:auto}ul{list-style:none;padding:0}li{margin:4px 0}#feedback{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#0969da;overflow-wrap:anywhere}:focus-visible{outline:3px solid #0969da;outline-offset:3px}.error{color:#b42318}.job{border-top:1px solid var(--line);padding:12px 0}@media(max-width:600px){section{padding:16px}header{flex-wrap:wrap}main{padding:20px 12px}}@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0d1117;--card:#161b22;--text:#e6edf3;--line:#3d444d;--muted:#a8b3c0}button:hover{background:#21262d}a{color:#79c0ff}.error{color:#ff7b72}}
</style></head><body><main><header><div><small>pqc-scan / Local scanner</small><h1 data-en="Scan a local project" data-ja="ローカルプロジェクトをスキャン">ローカルプロジェクトをスキャン</h1><p class="muted" data-en="Choose a folder, run a static scan and open its report." data-ja="フォルダを選び、静的スキャンとレポート表示を実行します。">フォルダを選び、静的スキャンとレポート表示を実行します。</p></div><label>Language / 言語 <select id="language"><option value="ja">日本語</option><option value="en">English</option></select></label></header><noscript>JavaScript is required for the local scanner. CLI scanning remains available.</noscript><section><h2 data-en="Choose a folder" data-ja="対象フォルダを選択">対象フォルダを選択</h2><p class="muted" data-en="Folder boundary (set with --root):" data-ja="参照起点（起動時の --root で指定）：">参照起点（起動時の --root で指定）：</p><p id="root" class="path"></p><div class="toolbar"><button type="button" id="up" data-en="↑ Parent folder" data-ja="↑ 親フォルダ">↑ 親フォルダ</button><strong id="selected" class="path">/</strong></div><ul id="folders" aria-label="Folders / フォルダ"></ul><p id="folder-note" class="muted"></p><div class="toolbar"><button class="primary" id="scan" disabled data-en="Scan this folder" data-ja="このフォルダをスキャン">このフォルダをスキャン</button><span class="muted" data-en="Uses the same rules and exclusions as the CLI." data-ja="CLIと同じルール・除外条件で解析します。">CLIと同じルール・除外条件で解析します。</span></div></section><p id="feedback" role="status" aria-live="polite"></p><section><h2 data-en="Scans in this session" data-ja="このセッションのスキャン">このセッションのスキャン</h2><div id="jobs"></div></section><p class="muted" data-en="Source files stay on this computer. Stop the server with Ctrl+C. Reports are kept in the private session folder printed in the terminal." data-ja="ソースファイルはこのコンピューター上で処理します。終了はCtrl+C。レポートはターミナルに表示した専用フォルダに保存します。">ソースファイルはこのコンピューター上で処理します。終了はCtrl+C。レポートはターミナルに表示した専用フォルダに保存します。</p></main><script src="app.js"></script></body></html>
