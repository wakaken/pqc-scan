[package]
name = "pqc_scan_probe_tls"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
test-fixtures = ["runtime", "dep:rcgen"]
runtime = ["dep:rustls", "dep:aws-lc-rs", "dep:webpki-roots", "dep:pqc_scan_detectors", "dep:pem", "dep:sha2", "dep:hex", "pqc_scan_core/probe-transport"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
pqc_scan_core = { path = "../pqc_scan_core" }
pqc_scan_detectors = { path = "../pqc_scan_detectors", optional = true }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "aws_lc_rs", "tls12"], optional = true }
aws-lc-rs = { version = "=1.18.0", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"], optional = true }
webpki-roots = { version = "=1.0.11", optional = true }
pem = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }

rcgen = { version = "=0.14.7", default-features = false, features = ["aws_lc_rs"], optional = true }

[dev-dependencies]
serde_json.workspace = true
jsonschema = { version = "=0.29.1", default-features = false }
