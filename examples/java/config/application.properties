app.name=legacy-auth-gateway
app.environment=staging

security.tls.min-version=TLSv1.1
security.tls.cipher-suite=TLS_RSA_WITH_AES_128_CBC_SHA
security.tls.rsa-pin=rsa-pin:prod-auth-gateway

auth.jwt.issuer=https://legacy-idp.internal
auth.jwt.id_token_signed_response_alg=RS256
auth.jwt.alg=RS256
auth.jwt.kid=legacy-rsa-key
auth.jwt.key-size=2048

pki.signatureAlgorithm=sha256WithRSAEncryption
pki.backupSignatureAlgorithm=ecdsa-with-SHA256
