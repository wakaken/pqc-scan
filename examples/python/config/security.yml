service: account-api
environment: staging

jwt:
  algorithm: RS256
  backup_algorithm: PS256
  id_token_signed_response_alg: RS256
  kid: legacy-rsa-key

tls:
  min_version: TLSv1.1
  ciphers:
    - TLS_RSA_WITH_AES_128_CBC_SHA
    - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256

pki:
  signature_algorithm: sha256WithRSAEncryption
  key_size: 2048
